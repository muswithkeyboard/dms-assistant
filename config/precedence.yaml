# Приоритет документов внутри договора (допущение A3, ADR 0006 п. 7). Меньше level — старше.
# Противоречие разных уровней → позиция по старшему + предупреждение с обеими цитатами + предложение письма в СК.
# Противоречие равных уровней → статус «источники противоречат друг другу» (ТЗ п. 8.1).
version: 1
levels:
  amendment: 1
  contract: 2
  program: 3        # объём помощи, исключения
  clinics: 4        # список МО / перечень клиник
  memo: 5
  insurer_reply: 6  # ответ СК — источник ветки автомата, не условие договора
  rules: 7          # общие правила СК
  catalog: 99       # не условия договора: в ответах о договоре не используется
  other: 50
not_contract_terms: [catalog]
