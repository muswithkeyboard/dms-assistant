# Запрещённые обещания в черновиках (ADR 0004, план §6.9). Проверка — тест на шаблонах и фильтр итогового текста.
# Совпадение — по регулярным выражениям без учёта регистра.
version: 1
patterns:
  - 'точно (будет|покро|оплат|добав)\w*'
  - '(страховая|СК) (обязательно )?(оплатит|покроет|согласует)'
  - 'клиника (уже )?добавлена'          # допустимо только в шаблоне после подтверждения СК (allow_in)
  - 'в течение \d+ (дн|час|рабоч)\w*'    # сроки не обещаем
  - 'в течение\s+[а-яё]+\s+(дн|дня|дней|час|рабоч|недел|месяц)\w*'   # сроки словами («в течение трёх дней»)
  - '\b(завтра|сегодня|в ближайшее время|незамедлительно|оперативно)\b'
  - '\bдо \d{1,2}[./]\d{1,2}'              # «до 01.11» — срок
  - '\bбудет (добавлен|оплачен|согласован|покрыт|одобрен)\w*'
  - 'гаранти\w*'                          # «гарантия», «гарантируем»
  - 'согласовано'
  - 'бесплатно для вас'
allow_in:
  'клиника (уже )?добавлена': [hr_clinic_added]
