# Маркеры маршрутизации по словам (src/dms_core/scenarios/route.py, правила без модели; план §6.6–6.8).
# version: 1 (24.10.2026, этап w5-recall: маркеры вынесены из кода — route._ADD_CLINIC, _REFUSAL, _COVERAGE, _PICK,
#   _INFO; добавлены вопросы о покрытии «…входит?», «…по полису?», «оплатят ли», «покроет ли», «бесплатно ли»,
#   косвенные отказы «завернули», «требует деньги», «не пропустили», «бесплатно не оформили»)
#
# Каждый ключ — список регулярных выражений Python (re, без учёта регистра); код склеивает их через «|».
# Порядок проверки в route.rule_scenario (первое совпадение задаёт сценарий):
#   add_clinic → sc02_add_clinic; refusal → sc01; compare → sc02_info (все три — во всём тексте); затем
#   pick_first → sc02_clinic;
#   info_first → sc02_info; coverage → sc01; coverage_soft → sc01; pick → sc02_clinic; info → sc02_info —
#   сначала в первом вопросе обращения из нескольких, потом во всём тексте; иначе general.
# kNN по эмбеддингам (config/route_examples.yaml) НЕ перебивает refusal и coverage: это явный вопрос о покрытии
# услуги или отказ (SC 01 даёт метку и включает все проверки SC 02 по услуге). coverage_soft («можно ли»,
# «может ли») kNN перебивать может: «можно ли застраховать родственника» — справка о договоре.
# Маркеры — общая лексика обращений менеджера, а не формулировки эталонов (`docs/rules.md` п. 6).
# version: 2 (25.10.2026, этап w5-recall2: естественные формулировки отказа и требования оплаты)
# version: 3 (25.10.2026, этап w5-strict: «не взяли / не ведёт приём по ДМС»; маркеры отказа запрещают «можно»)
# version: 4 (25.10.2026, этап w7-core: clinic_anchor_stop, clinic_anchor_max_share — строчные названия клиник)
# version: 5 (25.10.2026, этап w7-fix: clinic_type_words, clinic_name_descriptors, street_types — название клиники
#   «тип учреждения + номер» по перечню, названия из одних общих слов, улица филиала; refusal: «сказали
#   платить», «платить … самим»; разрешено автором)
version: 5

# Добавить клинику в программу
add_clinic:
  - '(добав|подключ|включ)\w*\s+(\w+\s+){0,3}(клиник|медцентр|центр|больниц|лпу)'
  - '(клиник|лпу)\w*\s+(\w+\s+){0,3}(добав|подключ|включ)'

# Отказ или требование оплаты — один класс (ТЗ п. 5.1: ветку «бесплатно / платно» определяет ответ СК, ADR 0004).
# Найденный маркер — ещё и слот refusal (правило «можно по программе без клиники» при нём не срабатывает).
refusal:
  # прямой отказ
  - 'отказ\w*|отклон\w*|развернул\w*|завернул\w*|отфутболи\w*'
  - 'не\s+(приня\w*|принима\w*|обслуж\w*|запис\w*|пусти\w*|пропусти\w*|пропуска\w*|соглас\w*|одобр\w*|подтверд\w*|дал[аи]?\b|дают|выдал\w*|выда[её]т\w*|оформ\w*)'
  - 'не\s+ста(л|ла|ли|ло)\s+(\w+\s+)?(дел\w*|провод\w*|оказ\w*|лечи\w*)'
  - 'не\s+хот\w*\s+(\w+\s+)?(дел\w*|принима\w*)'
  - 'не\s+(оплат\w*|покрыл\w*)'
  - 'не\s+по\s+(полису|программе|дмс|страховке)'
  # требование оплаты
  - '(попросил\w*|просят|просит|требу\w*|потребовал\w*|предложил\w*|предлагают|заставля\w*|сказал\w*,?\s+что)\s+(?:(?!ли\b)\w+\s+){0,3}?(до|за|о)?плат\w*'
  - '(попросил\w*|просят|просит|требу\w*|потребовал\w*|взял\w*|берут|бер[её]т|возьм\w*)\s+(\w+\s+){0,2}деньг\w*'
  # «без доплаты» — не требование оплаты (w5-strict: «СК добавит клинику без доплаты» — не отказ)
  - '(?<!без\s)доплат\w*|\bплатн\w*|за\s+(деньги|плату|свой\s+сч[её]т|наличн\w*)|выставил\w*\s+(\w+\s+)?сч[её]т|сч[её]т\s+за\b'
  - 'взял\w*\s+(\w+\s+)?деньг\w*|оплатить\s+(сам\w*|из\s+своего)'
  # требование оплатить долю или сумму: «требуют 15 % за приём», «списали 2000 рублей»
  - '(требу|просят|просит|попросил|берут|бер[её]т|взял|списал|списыва|удержал)\w*\s+(?:(?!ли\b)\w+\s+){0,3}?\d+\s*(%|процент|руб|р\.)'
  # «бесплатно не оформили», «не бесплатно»
  - 'бесплатно\s+(\w+\s+)?не\b|не\s+бесплатн\w*'
  # w5-recall2: естественные формулировки — «не берут по полису», «по полису не принимают», «денег хотят»,
  # «плати сам», «не стали записывать», «не страховой случай», «отправили на кассу», «выписали чек», «предложили
  # прайс», «раскошелиться», «только коммерческая», «не гарантирует оплату», «за наличку»
  - 'не\s+берут\s+(\w+\s+)?по\s+(полису|дмс|страховке|программе)|по\s+(полису|дмс|страховке|программе)\s+не\b'
  - '(денег|деньг\w*)\s+(хотят|хочет|требу\w*|просят|просит|берут)|(хотят|хочет)\s+(\w+\s+)?(денег|деньг\w*)'
  - '\bплат(и|ите)\s+сам|сам\w*\s+(платить|оплачивать|оплатить|заплатить)|заплатить\s+сам'
  - 'не\s+ста(л|ла|ли|ло)\s+(\w+\s+)?(запис\w*|принима\w*|оформл\w*|оплач\w*)'
  - 'не\s+(является\s+|являются\s+)?страхов\w+\s+случа\w*'
  - '\b(на|в)\s+кассу\b|отправил\w*\s+(\w+\s+)?(в|на)\s+касс'
  - 'выписал\w*\s+(\w+\s+)?ч[её]к|\bч[её]к(и|ом|а)?\b(?![-\s]?ап)'
  - '\bпрайс\w*|раскошел\w*|коммерческ\w*|не\s+гарантиру\w*|наличк\w*'
  # общий класс: оплата / касса / прайс / чек / «за свой счёт» + требование или отказ
  - '(оплат\w*|касс\w*|прайс\w*|сч[её]т\w*)\s+(\w+\s+){0,2}(потребовал\w*|требу\w*|просил\w*|настаива\w*|выставил\w*)'
  # w5-strict: «не взяли по ДМС», «не берут по страховке», «врач не ведёт приём по ДМС», «не работают по полису»
  # (эти же маркеры запрещают «можно» — guided.allowed_blocker; в coverage_markers.yaml они не повторяются)
  - 'не\s+(взял\w*|взяв\w*|бер[её]т|берут|брал\w*|вед[её]т|ведут|вести|работа\w*)\s+(\w+\s+){0,3}по\s+(полису|дмс|страховке|программе)'
  # w7-fix: «сказали платить за УЗИ самим», «говорят оплачивать» — требование оплаты без «что»
  - '\b(сказал\w*|говор(ят|ит|или|ил|ила))\s+(\w+\s+){0,2}(платить|оплачивать|оплатить|заплатить|доплачивать)\b'
  - '\b(платить|оплачивать|оплатить|заплатить)\s+(\w+\s+){0,3}сам(и|им|ому|ой)?\b'

# Сравнение программ / договоров — справка, где бы в обращении ни стояло («Входят ли клиники X и Y в программу?
# Чем программы отличаются?»): ищется во всём тексте сразу после отказа
compare:
  - 'сравн\w*|отлича\w*|различ\w*|разниц\w*'

# Справочные вопросы о договоре в целом (проверяются раньше вопросов о покрытии услуги): перечень, деньги договора,
# франшиза, численность, сравнение программ, включение людей в договор
info_first:
  - '\bчто\s+(\w+\s+)?(входит|входят|включ\w*|покрыва\w*)'
  - '\bкакие\s+(\w+\s+){0,3}(входят|включ\w*|покрыва\w*|предусмотрен\w*|доступн\w*|есть)'
  - '\bперечень|\bсписок\b'
  - 'взнос\w*|плат[её]ж\w*|срок\w*\s+(действия|оплат)|сколько\s+стои|стоимость\s+(полис|программ|договор)'
  - 'франшиз\w*'
  - 'сколько\s+(\w+\s+)?(человек|сотрудник|застрахован)'
  - 'застраховать|(включить|добавить|исключить|прикрепить)\s+(\w+\s+){0,3}(сотрудник|родствен|застрахованн|человек|нового|новых)'
  - 'прикреплени\w*\s+(\w+\s+){0,2}(родствен|супруг|ребен|детей|сотрудник)'
  - '(смен\w*|перев[её]\w*|перевод\w*)\s+(\w+\s+){0,3}программ|перевести\s+(\w+\s+){0,3}(со?|на)\s'
  - 'страхов\w+\s+сумм\w*|\bпреми\w*|как(ой|ие|ова)\s+(\w+\s+)?лимит'

# Подбор клиники (до справочных вопросов и вопросов о покрытии): «какие клиники», «подберите», «ближайшая клиника»
pick_first:
  - 'подбер\w*|подобра\w*|найти\s+клиник\w*|какие\s+клиник\w*|какую\s+клиник\w*'
  - 'ближайш\w*\s+(\w+\s+)?(клиник|поликлиник|больниц|медцентр|центр|лпу|стоматолог)\w*'

# Вопрос о покрытии услуги (SC 01, kNN не перебивает)
coverage:
  - 'положен\w*'
  - 'покрыва\w*|покро(ет|ют)\b|покрыт(о|а|ы)?\s+ли\b'
  - 'компенсир\w*|возмест\w*|возмеща\w*'
  - '\b(помощь|лечение|услуг\w*)\s+(будет|будут|окажут|предоставят)\b'
  - 'оплачива\w*|оплач(ен|ено|ена|ены)\b|оплат(ят|ит|ится|ятся)\b'
  - '\bвход(ит|ят)\b|\bвключ(ено|ена|ен|ены)\b|включает\s+ли|включа\w*\s+ли'
  - '(можно|может|могу|могут|можем)\s+ли\s+[^?]{0,60}\bпо\s+(дмс|полису|страховке|программе)'
  - '\bпо\s+(полису|дмс|страховке)\b[^?.!]{0,40}\?|\bпо\s+программе\s*\?'
  - 'бесплатн\w*\s+ли|ли\s+бесплатн\w*|бесплатн\w*\s*\?'
  - '(в|по)\s+(программ\w*|полис\w*|дмс|страховк\w*)\b[^?.!]{0,40}\b(есть|предусмотрен\w*|доступн\w*|возмож\w*)\s*\?'
  - '\b(доступн|возмож)\w*\s*\?\s*$'
  - '\bпо\s+(программе|полису|дмс|страховке)\b[^?.!]{0,60}\bможно\b|\bможно\b[^?.!]{0,60}\bпо\s+(программе|полису|дмс|страховке)\b'
  - '\bпо\s+программе\s+[«"]?[А-ЯЁA-Z][^?.!]{0,30}\?'
  - '(будет|будут)\s+ли\s+(\w+\s+)?(оплат|оплач|покры|бесплат)\w*'
  - 'сколько\s+(раз|процедур|сеансов|при[её]мов)\s+(\w+\s+){0,3}можно|сколько\s+можно'

# Вопрос о покрытии, который бывает и справкой о договоре (kNN может перебить)
coverage_soft:
  - 'можно\s+ли|может\s+ли|могу\s+ли|имеет\s+право'

# Подбор клиники (после вопросов о покрытии): «где сделать», «куда обратиться»
pick:
  - 'где\s+(можно|сделать|пройти|получить|лечить)|куда\s+(обратиться|пойти|записаться)'

# Прочие справочные вопросы о договоре
info:
  - 'входит\s+ли|услови\w*|лимит\w*|франшиз\w*|взнос\w*|плат[её]ж\w*|срок\w*|программ\w*'
  - 'договор\w*|исключени\w*|перечень|что\s+входит|сколько|сумм\w*'

# Не названия клиник (scenarios/route.clinic_phrase, guided.check_clinic): страховщики и органы, которые менеджер
# называет в обращении («в СОГАЗе сказали…», «в Ренессансе ответили…») — по началу слова, без учёта регистра.
# Иначе такое слово стало бы «клиникой не из перечня» → ложное «нельзя».
not_clinic_words: [согаз, ренессанс, зетта, ингосстрах, росгосстрах, вск, альфастрах, энергогарант, югория,
                   медстрах, минздрав, росздравнадзор, роспотребнадзор, фомс, омс, дмс, страховщик, страховая,
                   поликлиника]
# Страховщик в названии клиники («Ренессанс Здоровье»): клиника не отбрасывается, если строка перечня программы
# совпала с названием целиком в обе стороны (route.listed_full_match, этап w7-core).

# Этап w7-core: слова названий / юрлиц перечня, по которым название клиники без кавычек и без заглавной буквы НЕ
# ищется (леммы): форма собственности, ведомства, география, служебные слова строк перечня. Такое название ищется по
# отличительным словам строк перечня договора («к урологу в медэкспресс», «в тонус премиум»), эти слова
# отличительными не считаются. Слово, которое есть в названиях больше чем у clinic_anchor_max_share разных названий
# перечня (и больше 8), — тоже общее.
clinic_anchor_stop: [общество, ограниченный, ответственность, учреждение, государственный, здравоохранение,
                     бюджетный, автономный, акционерный, некоммерческий, казённый, казенный, частный, организация,
                     обслуживание, обслуживать, дополнительный, отдел, офис, филиал, бренд, область, город, район,
                     край, республика, россия, российский, федерация, министерство, минздрав, минобороны, фмба,
                     университет, институт, помощь, скорый, страхование, франшиза, часть, санитарный, научный,
                     исследовательский, федеральный, национальный, имя, группа, компания, сеть, холдинг, услуга,
                     улица, проспект, дом, корпус, строение, отделение, приём, прием, консультация, лечение]
clinic_anchor_max_share: 0.1


# w7-fix: общее слово типа учреждения (леммы). «тип + номер» («Поликлиника №1», «12 КДЦ», «мсч № 152», «Медицинские
# центры-7») — название клиники, если в перечне договора есть строка с этим словом и этим номером (route.numbered_clinic).
clinic_type_words: [поликлиника, больница, клиника, медцентр, центр, госпиталь, диспансер, роддом, санаторий,
                    лаборатория, стоматология, консультация, амбулатория, медсанчасть, мсч, кдц, кб, гкб, окб, цкб,
                    дгкб, гп, дгп, гкп, лдц, мдц, кдп, дц, мц, цгб, црб, гб]
# w7-fix: описательные слова названий (леммы): название строки перечня только из них и типов учреждения
# («Семейный медицинский центр») — не название для поиска в вопросе (route.whole_name_clinic); «Семейный доктор»,
# «Медицинские услуги», «Будь здоров», «Здоровье» — названия (есть слово вне списка).
clinic_name_descriptors: [медицинский, клинический, лечебный, лечебно, диагностический, многопрофильный, городской,
                          детский, семейный, частный, стоматологический, медицина, медико, консультативный,
                          областной, краевой, районный, республиканский, центральный, новый, клиник]
# w7-fix: слова формы собственности и ведомств (леммы) — части названия только из них и описательных слов
# («Общество с ограниченной ответственностью») названием для поиска не считаются
clinic_legal_words: [общество, ограниченный, ответственность, акционерный, учреждение, государственный, бюджетный,
                     автономный, некоммерческий, казённый, казенный, организация, здравоохранение, филиал, отделение,
                     федеральный, министерство, департамент, комитет, г, город, область, россия]
# w7-fix: типы улиц (начало слова): «на улице Кулакова», «в 1-м Смоленском переулке», «по адресу улица Плющиха»
street_types: [улиц, ул, проспект, пр-т, просп, переул, пер, шоссе, ш, бульвар, б-р, проезд, пр-д, тупик, туп,
               набережн, наб, площад, пл, аллея, аллее, аллеи, линия, линии, вал, валу, тракт, микрорайон, мкр]
