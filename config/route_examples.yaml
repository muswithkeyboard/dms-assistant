# Примеры формулировок менеджера для маршрутизации kNN по эмбеддингам (ADR 0009). Свои формулировки автора,
# НЕ вопросы эталонов К10–К19 и своих кейсов (правило 6: подгонять под эталоны нельзя). Обобщённые: без названий
# клиник, программ и договоров комплекта. Пополнять по новым типам вопросов, проверять на eval (без holdout).
version: 1
k: 3                     # соседей; голосование по сумме сходства
min_similarity: 0.55     # ниже — сосед не голосует; нет голосов — решение правил
min_margin: 0.5          # отрыв победителя от второго места (доля голосов); ниже — решение правил
