# Виды помощи и синонимы для поиска (план §6.4). Канонический код → названия в документах СК и разговорные формы.
# Пополняется в волне 2 по документам комплекта (не по эталонам).
# version: 2 (25.10.2026, этап w5-recall2, дополнение разрешено автором):
#   route_words — слова вопроса, которые относят его к виду помощи (специалисты, разговорные формы), но не
#     являются названием вида помощи: по ним ставится слот care_type (scenarios/route._care_types, второй проход —
#     после названий и синонимов всех видов), а строки матрицы и перечня клиник по ним НЕ сравниваются
#     («логопед» не делает строку «Консультации логопеда» строкой вида помощи «Поликлиника»);
#   part_of — вид помощи оказывается в рамках другого (диагностика — в амбулаторно-поликлинической помощи):
#     строки матрицы и перечня клиник сравниваются и по названию/синонимам вида-родителя
#     (tools/clinics._care_phrase_sets): клиника «Поликлиника» подходит для «УЗИ»; восстановительное лечение
#     (ЛФК, массаж, мануальная терапия) — тоже в рамках амбулаторно-поликлинической помощи.
version: 2
care_types:
  outpatient:
    name: Амбулаторно-поликлиническая помощь
    synonyms: [поликлиника, амбулаторная, АПП, прием врача]
    route_words: [терапевт, педиатр, невролог, невропатолог, кардиолог, эндокринолог, гастроэнтеролог, уролог,
                  гинеколог, офтальмолог, окулист, лор, отоларинголог, оториноларинголог, дерматолог,
                  дерматовенеролог, хирург, травматолог, ортопед, ревматолог, аллерголог, иммунолог, пульмонолог,
                  нефролог, онколог, маммолог, проктолог, колопроктолог, флеболог, инфекционист, гематолог,
                  психотерапевт, психиатр, психолог, логопед, сомнолог, трихолог, диетолог, андролог, гепатолог,
                  врач общей практики, семейный врач, специалист]
  home:         {name: Помощь на дому, synonyms: [вызов врача на дом, на дому, ПНД], route_words: [на дом]}
  emergency:    {name: Скорая медицинская помощь, synonyms: [скорая, СМП]}
  inpatient:    {name: Стационарная помощь, synonyms: [стационар, госпитализация, плановая госпитализация, экстренная госпитализация]}
  dental:
    name: Стоматологическая помощь
    synonyms: [стоматология, зубы, лечение зубов, чистка, снятие налёта, AIR FLOW, гигиена полости рта]
    route_words: [стоматолог, зубной врач, ортодонт, пародонтолог, кариес, пломба, пульпит, пародонтит]
  diagnostics:
    name: Диагностика
    synonyms: [МРТ, КТ, УЗИ, рентген, анализы, лабораторная диагностика]
    route_words: [ЭКГ, ЭхоКГ, ЭЭГ, холтер, гастроскопия, колоноскопия, ФГДС, маммография, флюорография,
                  денситометрия, анализ, обследование]
    part_of: outpatient
  rehab:
    name: Восстановительное лечение
    synonyms: [реабилитация, ЛФК, массаж, физиотерапия]
    route_words: [мануальная терапия, мануальный терапевт, физиотерапевт, остеопат, остеопатия, рефлексотерапевт,
                  иглорефлексотерапия, ударно-волновая терапия, УВТ]
    part_of: outpatient
  telemed:      {name: Телемедицина, synonyms: [онлайн-консультация, телемедицинская консультация]}
