# Разметка таблиц перечня клиник оператором (ADR 0012, docs/CONTRACTS.md §10). Версия 4, 26.10.2026 (w10-matrix:
# матрица «программа × вид помощи», ADR 0013, CONTRACTS §11). Версия 5 (w10-fix): программа «*» — все программы договора.
# Версия 6 (w10-fix2): «по направлению» в тексте строки, подозрительные колонки программ матрицы, противоречие
# «нет» матрицы и клиник перечня.
# Слова заголовков для угадки ролей колонок и тексты предупреждений / ошибок. Логика — dms_core/table_mapping.py.
version: 6

# Угадка роли колонки по словам ячейки заголовка (нормализованный текст: регистр, ё→е, без знаков).
# Порядок важен: первая подошедшая роль; колонка получает одну роль, роль — одну колонку (первую слева).
# Слово — начало слова заголовка («адрес» подходит к «адреса», «адресу»).
header_words:
  legal_name: ["юр лицо", "юрлицо", "юридическое", "юр наименование", "инн"]
  address: ["адрес", "местонахождение", "место нахождения"]
  city: ["город", "регион", "населенный пункт", "субъект"]
  program: ["программа", "вариант", "план страхования"]
  care_type: ["вид помощи", "виды помощи", "вид медицинской", "виды медицинской", "вид услуг", "виды услуг",
              "услуги", "вид обслуживания"]
  franchise_pct: ["франшиза"]
  code: ["код", "шифр"]
  by_referral: ["по направлению", "направление"]
  access_note: ["примечание", "особые условия", "комментарий"]
  clinic_name: ["наименование", "название", "клиника", "лпу", "медицинская организация", "медицинское учреждение",
                "медучреждение", "мо"]

# Значение колонки «по направлению», означающее «да»: слово «да» или основа «направлен»
referral_yes: ["да", "направлен", "+", "значок"]
# «По направлению» в тексте строки перечня — в любой ячейке, какая бы роль ни была у колонки (этап w10-fix2: у СОГАЗ
# «Организация услуг по направлению страховщика» пишется в колонке «Телефон»): строка — by_referral. Регулярное
# выражение по тексту строки (без регистра). Колонка, где так написано, предлагается как by_referral.
referral_text: '(?<!\w)(?:только\s+)?по\s+направлени[юяе](?!\w)'
# Значение колонки франшизы «не применяется» (это не 0 %, docs/CONTRACTS.md §1)
franchise_none: ["—", "-", "–", "нет", "не применяется", "не предусмотрена"]

# Программа строк пробного разбора, если в разметке нет источника программы (только предпросмотр: сохранить такую
# разметку нельзя — mapping_no_program; на экран ответов эта строка как «программа договора» не попадает)
default_program: "Перечень клиник договора"

# Картинка-значок в ячейке docx без текста (у «Ренессанса» — «по направлению» в колонке значков): так ячейка видна в
# предпросмотре, колонку можно разметить by_referral («значок» — в referral_yes). В раскладку таблицы не входит.
icon_mark: "[значок]"

# Одноячеечная строка-примечание к строке клиники выше (не подзаголовок вида помощи): начало нормализованного текста
# (без регистра) или первый знак строки
note_prefixes: ["внимание", "примечание", "обратите внимание"]
note_marks: ["^", "*"]

# Ячейка названия, которая не название клиники: строки итогов и шапки таблиц премий (нормализованный текст равен
# слову / фразе или начинается с неё и пробела). Числа и суммы без букв — тоже не название (правило в коде).
skip_names: ["итого", "всего", "страховая премия", "программа", "программа страхования", "название программы"]

# Блоки программ в одной таблице (program_from_title): строка из одной ячейки задаёт программу следующих строк.
# Регулярные выражения по тексту строки (без регистра): block_variant — «Вариант № N <программа>» (группа 1 — номер,
# группа 2 — программа); block_some — «Общие для вариантов: 1 <программа>, 3 <программа>» (номера — числа перед
# словом); block_all — «Общие для всех вариантов» (все варианты таблицы).
block_variant: '^\s*вариант\s*№?\s*(\d+)\s*[.:–—-]?\s+(.+?)\s*$'
block_some: '^\s*общие\s+для\s+вариантов\s*:\s*(.+)$'
block_all: '^\s*общие\s+(?:программы\s+)?для\s+всех\s+вариантов'
# Франшиза в тексте строки-заголовка блока или раздела: «Франшиза (требуется активация) - 15%.», «франшиза 15 %»;
# группа 1 — процент. Если франшиза — начало строки, она снимается с вида помощи.
franchise_text: 'франшиз\w*[^%\d\n]{0,60}?(\d+(?:[.,]\d+)?)\s*%\s*[.,;:]?\s*'

# Проверка содержимого разметки (подозрительная разметка: таблица премий вместо перечня)
content_check:
  name_share: 0.6        # доля строк, где ячейка названия похожа на название организации, не меньше
  address_share: 0.5     # доля строк с адресными словами / индексом в колонке адреса, не меньше
  money_share: 0.6       # колонка «денег»: доля чисел и сумм среди заполненных ячеек, не меньше

# ---------------------------------------------------------------- матрица «программа × вид помощи» (ADR 0013)
# Значение ячейки матрицы (table_mapping.cell_value). Сравнение — по всей ячейке: знак (как есть, без пробелов и
# точки в конце) или нормализованный текст (регистр, ё→е, без знаков). Фраза present / знак present_marks / ячейка
# только из слов present_words («Да, входит») — входит; фраза absent / знак absent_marks — явное «нет» («нельзя» по
# матрице — только так; ключи не yes / no: YAML читает их как true / false). Пусто — строки
# нет; прочий текст (суммы, лимиты, примечания) — строки нет, ячейка — в список пропущенных (оператор видит).
matrix_values:
  present: ["да", "входит", "включено", "включен", "включена", "включены", "предусмотрено", "предусмотрен", "есть",
        "v", "да входит", "входит в программу", "включено в программу"]
  present_marks: ["+", "✓", "✔", "√", "☑", "V", "v", "●", "•"]
  present_words: ["да", "входит", "включено", "включен", "включена", "включены", "в", "программу", "предусмотрено"]
  absent: ["нет", "не входит", "не включено", "не включен", "не включена", "не предусмотрено", "не предусмотрен",
       "x", "х", "не входит в программу", "исключено"]
  absent_marks: ["—", "-", "–", "x", "X", "х", "Х", "×", "✗", "✘"]
  # длинная таблица: слова заголовка колонки «входит» (роль present) — для предложения разметки
  present_header: ["входит", "включено", "наличие", "покрытие", "предусмотрено"]

# Слова видов помощи для проверки содержимого колонки видов помощи (сверх названий, синонимов и слов
# config/care_types.yaml): начало слова ячейки (как у слов заголовка)
# Не «медицинск», «врач», «услуг»: так начинаются и названия клиник («Медицинский центр …»).
care_words: ["помощь", "обслуживание", "лечение", "консультац", "диагностика", "исследован", "поликлин", "амбулатор",
             "стационар", "госпитализ", "стоматология", "скорая", "вызов", "анализ", "прием", "реабилит",
             "восстановит", "телемедиц", "профилакт", "вакцинац", "массаж", "лфк", "физиотер", "узи", "мрт",
             "рентген", "осмотр", "диспансер", "медикамент", "оптика", "ведение", "беременн", "лабораторные"]

matrix_check:
  care_share: 0.5        # доля строк, где ячейка видов помощи похожа на вид помощи, не меньше
  value_share: 0.5       # wide: доля распознанных «да / нет» среди заполненных ячеек колонок программ, не меньше
  program_share: 0.5     # доля программ разметки, совпавших с программами договора / перечня, не меньше

