# Подтверждение клиники менеджером (ADR 0010, этап w6-core). Тексты кнопок и карточки выбора — config/texts_ru/ui.yaml
# (этап w6-ui); здесь — формулировки guided при учтённом выборе и сообщения пользователя, которые дописывает сервис.
# Подстановки — только значения строки перечня и контекста: {clinic}, {program}, {care}, {address}, {n}.
version: 2
guided:
  clinic_pick_yes: 'Клиника «{clinic}» ({address}) — строка перечня клиник программы «{program}», выбранная менеджером: {care}.'
  clinic_pick_yes_short: 'Клиника «{clinic}» — строка перечня клиник программы «{program}», выбранная менеджером.'
  clinic_pick_other_care: 'Выбранная строка перечня программы «{program}» — клиника «{clinic}» — относится к другим видам помощи: {care}. Для вида помощи вопроса строки этой клиники по этому адресу нет.'
  clinic_pick_listed_no_care: 'Выбранная строка перечня программы «{program}» — клиника «{clinic}» — без вида помощи: подходит ли клиника для вида помощи вопроса, по перечню не видно.'
  clinic_pick_absent: 'Менеджер отметил: клиники «{clinic}» нет в перечне клиник (списке медицинских организаций) программы «{program}» (строк перечня программы: {n}).'
  missing_clinic_pick_unknown: 'Выбранной строки нет в перечне клиник программы «{program}» этого договора — выбор не учтён, уточните клинику.'
  missing_clinic_pick_no_listing: 'Перечень клиник программы «{program}» не получен — отметку «нет в перечне» учесть нельзя.'
service:
  user_pick_row: 'Клиника: {name}, {address}'
  user_pick_row_no_address: 'Клиника: {name}'
  user_pick_none: Клиники нет в перечне программы
  error_no_choice: В последнем ответе нет выбора клиники по этому договору — задайте вопрос с названием клиники.
  error_row_unknown: Этой строки нет в перечне клиник программы договора — выберите клинику из предложенных.
  error_contract: Договор не из контекста этого чата.
  error_choice: Выберите строку перечня клиник или «Нет в перечне программы».
  error_offset: Номер первой строки поиска — целое число не меньше 0.
