# Ответ ассистента в виде сообщения чата (ADR 0014). Шаблоны заполняет compose.chat_reply; правит этап w15-reply.
# Всё, что подставляется в шаблоны, — из уже проверенных утверждений и цитат ответа (verify); знаний модели нет.
version: 1

# lead: «<Метка словами>: <одна фраза по существу>» (образ ответа заказчика, слайд 13). SC 02 — без метки.
label_words:
  allowed: Можно
  denied: Нельзя
  conditional: Можно при условиях
  insufficient: Недостаточно данных
lead_label: '{label}: {text}'
# разбор отказа клиники (w14): основания отказа — из краткого вывода guided, экстренный порядок — если есть пункт
lead_refusal: 'отказ может быть обоснован, если {grounds}'
lead_refusal_conditional: 'помощь входит, но отказ может быть обоснован, если {grounds}'
lead_refusal_emergency: '; если случай экстренный — действует отдельный порядок экстренной госпитализации'
lead_refusal_no_grounds: 'условий, при которых отказ обоснован, в документах по этой услуге не нашли — запросите у клиники причину отказа'
# причина отказа, названная в вопросе (слайд 12: услуга, клиника, причина) — вторая фраза lead
lead_reason: 'Причина отказа со слов клиники: «{reason}».'
# где в вопросе названа причина: «говорит …», «сказали, что …», «сослались на …», «потому что …»
reason_rx: '(?:говорит|говорят|сказал\w*|ответил\w*|объяснил\w*|мотивировал\w*|сосла\w+\s+на|ссылаю?т\w*\s+на|потому\s+что|так\s+как|из-за|причина\s*[:—-])\s*[,:—-]?\s*(?:что\s+)?(?P<reason>[^,.;!?—]{3,80}?)\s*(?=[,.;!?—]|\s-\s|\s+так\s+можно|\s+это\s+|$)'
# «Можно при условиях»: главное утверждение + слова условий из цитат пунктов-условий (quote_markers)
lead_conditions: '{text}; условия: {conditions}'
lead_conditions_below: 'в пунктах ниже'
lead_clinic_in_list: 'клиника «{clinic}» есть в перечне клиник программы «{program}»'
lead_no_points: 'в документах договора не найдено подтверждённых условий по вопросу'
lead_clinic_choice: 'Выберите клинику в карточке ниже — тогда проверю её по перечню программы.'
lead_clarify: '{question}'
lead_extractive: 'Модель недоступна: ниже — найденные пункты документов без вывода, проверьте их вручную.'
lead_info_empty: 'В документах договора не найдено подтверждённых условий по вопросу.'
# ГК: сводно по договорам («По 3 договорам из 5 — можно; по 2 — недостаточно данных»)
lead_group: 'По договорам группы: {parts}.'
lead_group_part: 'по {n} из {total} — {label}'
lead_group_same: '{label} — по всем договорам группы ({n}): {text}'
lead_group_all: 'Во всех договорах группы ({n}) одинаково: {text}'
lead_group_nolabel: 'Ответ по каждому договору группы отдельно — ниже; условия одного договора на другой не переносятся.'
lead_group_empty: 'В документах договоров группы не найдено подтверждённых условий по вопросу.'
group_label_lower:
  allowed: можно
  denied: нельзя
  conditional: можно при условиях
  insufficient: недостаточно данных
contract_caption: 'Договор № {number}'
contracts_caption: 'Договоры № {number}'
point_with_contract: '{caption}: {text}'

# points: утверждение «по этому пункту» → тема + содержание пункта (слова из цитаты по словарю ниже, иначе фрагмент)
point_topic: '{topic} — {content}'
point_topic_quote: '{topic}: {content}'
# ссылка «на этот пункт» вместо содержания: всё, начиная с этих слов, отрезается и заменяется содержанием цитаты
this_clause: '(?:\s*[—–-]\s*)?(?:\s*(?:идёт|идет|см\.?))?\s*(?:по порядку\s+)?(?:по\s+)?(?:этого|этому|этот|этим|этом)\s+пункт\w*.*$'
# вводные слова темы, которые после отрезания не нужны
topic_lead_in: '^(?:если случай экстренный|если случай плановый)\s*[—–-]\s*'
# слова условий в цитате → формулировка (общие слова договоров ДМС, не под конкретные кейсы)
quote_markers:
  - ['направлени\w*\s+(?:лечащего\s+)?врач|по направлению', 'по направлению врача']
  - ['согласовани\w*\s+(?:со?\s+)?страховщик|гарантийн\w*\s+письм', 'с согласованием страховщика']
  - ['жизненн\w*\s+показани', 'по жизненным показаниям']
  - ['ближайш\w*', 'в ближайшую подходящую больницу']
  - ['догоспитальн\w*\s+обследовани', 'с результатами обследования до госпитализации']
  - ['франшиз\w*', 'с франшизой']
  - ['доплат\w*|за\s+счёт\s+застрахованн|за\s+счет\s+застрахованн', 'с доплатой застрахованного']
  - ['медицинск\w*\s+показани', 'по медицинским показаниям']
  - ['не\s+более\s+\d+\s*(?:раз|посещ|обращ|при[её]м|консультац|вызов)', 'с ограничением по числу обращений']
# служебные слова → человеческие (применяются к lead и тексту пунктов)
replace:
  - ['\(матрица видов помощи\)', '(таблица видов помощи программы)']
  - ['\(матрица\)', '(таблица видов помощи программы)']
  - ['в матрице программы', 'в таблице видов помощи программы']
  - ['матриц\w* видов помощи', 'таблица видов помощи программы']
  - ['\(допущение, не условие договора\)', '(допущение)']
  - ['\s*Фрагмент исключений:.*$', '']
  - ['\s*\(пункты выше\)', '']
  - ['\s*—?\s*проверьте пункты ниже', '']
  - ['\bsupports\b', '']
  - ['\bguided\b', '']
# метка допущения «по словарю» (план: вид помощи по словарю — допущение, не условие договора)
assumption_marker: 'по словарю видов помощи'

# caution: одна строка
caution: 'Ответ — по документам договора; окончательное решение по случаю — за страховой компанией.'
caution_assumption: ' Вид помощи для услуги определён по словарю (допущение) — подтвердите в СК.'
caution_extractive: 'Вывода нет: модель недоступна, показаны найденные пункты — проверьте их вручную.'
caution_group: ' Условия одного договора на другой не переносятся.'
