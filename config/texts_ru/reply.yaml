# Ответ ассистента в виде сообщения чата (ADR 0014). Шаблоны заполняет compose.chat_reply; правит этап w15-reply.
# Всё, что подставляется в шаблоны, — из уже проверенных утверждений и цитат ответа (verify); знаний модели нет.
version: 2

# Разбор отказа с фактами со слов менеджера (guided.refusal_facts, ответы на «Что уточнить»): итог первой фразой.
lead_refusal_justified: 'условие не выполнено, отказ обоснован: {why}'
lead_refusal_cleared: 'по документам основание отказа не подтверждается ({why}) — запросите у клиники причину отказа письменно'

# Факты обращения о госпитализации со слов менеджера (guided.refusal_facts): шаблоны по тексту вопроса в нижнем
# регистре (ё → е). Совпали оба варианта — берётся более поздний в тексте (ответ на уточнение дописан в конец).
refusal_facts:
  emergency: ['экстренн', 'неотложн']
  planned: ['планов']
  referral_yes:
    - 'направлени\w*[^.?!;]{0,90}?\s(?:есть|имеется|имелось|было|был|была|выдан\w*|получен\w*)(?=[\s.,;!]|$)'
    - '(?:^|\s)(?:с|по)\s+направлени\w*\s+(?:лечащего\s+)?врач'
    - 'направлени\w*\s+(?:врача\s+)?на\s+руках'
  referral_no:
    - '(?:нет|без|не было|отсутству\w*|не выдал\w*|не дали)\s+(?:\w+\s+){0,2}направлени'
    - 'направлени\w*[^.?!;]{0,90}?\s(?:нет|не было|отсутству\w*|не выдан\w*)(?=[\s.,;!]|$)'

# lead: «<Метка словами>: <одна фраза по существу>» (образ ответа заказчика, слайд 13). SC 02 — без метки.
label_words:
  allowed: Можно
  denied: Нельзя
  conditional: Можно при условиях
  insufficient: Недостаточно данных
lead_label: '{label}: {text}'
# разбор отказа клиники (w14): основания отказа — из краткого вывода guided, экстренный порядок — если есть пункт
lead_refusal: 'отказ может быть обоснован, если {grounds}'
lead_refusal_conditional: 'помощь входит, но отказ может быть обоснован, если {grounds}'
lead_refusal_emergency: '; если случай экстренный — действует отдельный порядок экстренной госпитализации'
lead_refusal_no_grounds: 'условий, при которых отказ обоснован, в документах по этой услуге не нашли — запросите у клиники причину отказа'
# причина отказа, названная в вопросе (слайд 12: услуга, клиника, причина) — вторая фраза lead
lead_reason: 'Причина отказа со слов клиники: «{reason}».'
# где в вопросе названа причина: «говорит …», «сказали, что …», «сослались на …», «потому что …»
reason_rx: '(?:говорит|говорят|сказал\w*|ответил\w*|объяснил\w*|мотивировал\w*|сосла\w+\s+на|ссылаю?т\w*\s+на|потому\s+что|так\s+как|из-за|причина\s*[:—-])\s*[,:—-]?\s*(?:что\s+)?(?P<reason>[^,.;!?—]{3,80}?)\s*(?=[,.;!?—]|\s-\s|\s+так\s+можно|\s+это\s+|$)'
# «Можно при условиях»: главное утверждение + слова условий из цитат пунктов-условий (quote_markers)
lead_conditions: '{text}; условия: {conditions}'
# строка таблицы «раздел: услуга — да; условие» в первой фразе — словами (compose._row_lead)
lead_row_rx: '^(?P<section>[^:]{3,90}):\s*(?P<service>.+?)\s+—\s+(?P<value>да|нет)(?:\s*;\s*(?P<rest>.+?))?\.?$'
lead_row_yes: '{service} входит в программу'
lead_row_yes_rest: '{service} входит в программу ({rest})'
lead_row_no: '{service} в программу не входит'
lead_conditions_below: 'в пунктах ниже'
lead_clinic_in_list: 'клиника «{clinic}» есть в перечне клиник программы «{program}»'
# «недостаточно данных», а главное утверждение — факт (вид помощи входит): прямого ответа по услуге нет
lead_insufficient_service: 'ближе всего к вопросу пункт «{fact}», но прямо ли он о вашем случае, по документам не ясно'
# слова самого вопроса, а не услуги (основы): «входит ли», «можно ли сделать», «сотруднику», «оплатит страховая»
# условие обращения, а не услуга — не слова услуги (compose._q_lemmas): «без направления терапевта»
qualifier_rx: '(?:по|после|без|с)\s+(?:направлени|назначени|согласовани|рекомендаци)\w*(?:\s+(?:лечащего\s+)?[а-яё-]+){0,2}|после\s+[а-яё-]+|(?:в|из|у)\s+клиник\w*\s+.*$'
# не ключевые слова услуги при выборе главного пункта (compose._key_lemmas), сверх procedures.generic
key_skip: [обеспечение, помощь, услуга, обслуживание, вопрос, случай, размер, сотрудник, сотрудница, полис, программа,
           договор, страховая, компания, раз, год, день, неделя, месяц, срок, причина, клиника, город, место,
           сеанс, посещение, отдых, командировка, отпуск, температура, жалоба, показание, назначение, направление]
question_noise: [вход, можн, сдела, оплат, покрыв, покрыт, сотрудник, страхов, положен, имеет, прав, нужн, скольк,
                 раз, год, получ, пройт, сходит, обратит, делать, ли, наш, полис, дмс, застрахован, могу, может,
                 клиник, отказ, правомер, обоснова, бесплат, хотет, надо, нуж, стоит, будет, быть, полож, програм,
                 договор, услуг, оплач, какой, покрыва, нужн, можн, если, друг, другой, этот, есть, быть, имеет]
lead_insufficient_exclusion: 'услуга упомянута в исключениях — «{text}»; относится ли исключение к этому случаю, решает страховая компания'
lead_insufficient_care: 'услуга в документах прямо не названа; вид помощи «{care}» в программе «{program}» есть{where} — относится ли к нему услуга, уточните в СК'
lead_care_where_matrix: ' (таблица видов помощи программы)'
# повтор программы в названии строки таблицы видов помощи: «Программа "Стандарт". Стационарное обслуживание»
care_name_strip: 'Программа\s+"[^"]+"\.\s*'
# пункта со ключевыми словами услуги нет (compose._key_lemmas): ближайший пункт о другом за ответ не выдаётся
lead_not_named: 'в документах договора прямо не названо: «{what}»'
lead_not_named_below: 'Ниже — пункты, где встречаются слова вопроса; проверьте, относятся ли они к случаю.'
lead_insufficient_fact: '{fact}, но прямого ответа по самой услуге в документах не нашли'
# «Что уточнить» при «недостаточно данных», когда обязательных фактов движок не назвал (правило 2)
ask_insufficient:
  - 'Как точно называется услуга или диагноз (как в направлении врача)?'
  - 'Нужна ли позиция страховой компании по этому случаю?'
lead_no_points: 'в документах договора не найдено подтверждённых условий по вопросу'
lead_clinic_choice: 'Выберите клинику в карточке ниже — тогда проверю её по перечню программы.'
lead_clarify: '{question}'
lead_extractive: 'Модель недоступна: ниже — найденные пункты документов без вывода, проверьте их вручную.'
# бессмысленный ввод и набор в английской раскладке (inputcheck.py, круг 2 ревизии w16)
lead_not_understood: 'Не понял вопрос. Напишите словами, что нужно проверить по договору, — например: «Входит ли МРТ в программу?» или «Какой срок действия договора?»'
lead_wrong_layout: 'Похоже, вопрос набран в английской раскладке: «{text}». Отправить его так?'
# обычные реплики в чате (inputcheck.smalltalk, w17): сообщение целиком — реплика; [шаблон, ответ]
smalltalk:
  - ['(?:привет\w*|здравств\w*|добр\w+\s+(?:день|утро|вечер)|доброе\s+утро|hello|hi)(?:\s+\w+)?',
     'Здравствуйте! Спросите об услуге, клинике или условиях договора — например: «Входит ли МРТ в программу?» или «Клиника отказала в приёме стоматолога — правомерно?»']
  - ['(?:спасибо|благодарю|спс|сенкс)(?:\s+\w+){0,2}',
     'Пожалуйста! Если появится ещё вопрос по договору — пишите.']
  - ['(?:что|чем)\s+(?:ты\s+)?(?:умеешь|можешь|помож\w*)|кто\s+ты|как\s+(?:тобой\s+)?пользоват\w*|помощь|help',
     'Я отвечаю по документам договора ДМС выбранного чата: входит ли услуга в программу, есть ли клиника в перечне, правомерен ли отказ клиники, какой срок действия договора. Каждый вывод — со ссылкой на пункт документа. Пишите своими словами, например: «сотрудника не приняли у лора в Медси, это законно?»']
  - ['(?:ок|окей|ясно|понятно|хорошо|понял\w*)', 'Хорошо. Задайте следующий вопрос, когда будет нужно.']
lead_info_empty: 'В документах договора не нашлось ничего по этому вопросу. Спросите об услуге, клинике, лимите или условиях договора — например: «Входит ли МРТ в программу?»'
# ГК: сводно по договорам («По 3 договорам из 5 — можно; по 2 — недостаточно данных»)
lead_group: 'По договорам группы: {parts}.'
lead_group_part: 'по {n} из {total} — {label}'
lead_group_same: '{label} — по всем договорам группы ({n}): {text}'
lead_group_same_some: '{label} — по всем договорам группы ({n}). {caption}: {text}'
lead_group_points_below: 'что сказано в договорах — ниже'
lead_group_all: 'Во всех договорах группы ({n}) одинаково: {text}'
lead_group_nolabel: 'Ответ по каждому договору группы отдельно — ниже; условия одного договора на другой не переносятся.'
lead_group_empty: 'В документах договоров группы не найдено подтверждённых условий по вопросу.'
group_label_lower:
  allowed: можно
  denied: нельзя
  conditional: можно при условиях
  insufficient: недостаточно данных
contract_caption: 'Договор № {number}'
contracts_caption: 'Договоры № {number}'
point_with_contract: '{caption}: {text}'

# points: утверждение «по этому пункту» → тема + содержание пункта (слова из цитаты по словарю ниже, иначе фрагмент)
point_topic: '{topic} — {content}'
point_topic_quote: '{topic}: {content}'
# ссылка «на этот пункт» вместо содержания: всё, начиная с этих слов, отрезается и заменяется содержанием цитаты
this_clause: '(?:\s*[—–-]\s*)?(?:\s*(?:идёт|идет|см\.?))?\s*(?:по порядку\s+)?(?:по\s+)?(?:этого|этому|этот|этим|этом)\s+пункт\w*.*$'
# вводные слова темы, которые после отрезания не нужны
topic_lead_in: '^(?:если случай экстренный|если случай плановый)\s*[—–-]\s*'
# слова условий в цитате → формулировка (общие слова договоров ДМС, не под конкретные кейсы)
quote_markers:
  - ['по\s+направлени\w*\s+(?:страховщик|пульт)', 'по направлению страховщика']
  - ['направлени\w*\s+(?:лечащего\s+)?врач|по направлению(?!\s+(?:страховщик|пульт))', 'по направлению врача']
  - ['однократн\w*', 'однократно']
  - ['без\s+ограничени\w*\s+по\s+(?:количеств|числ)', 'без ограничения по числу обращений']
  - ['телемедицин\w*', 'в том числе в телемедицине']
  - ['согласовани\w*\s+(?:со?\s+)?страховщик|гарантийн\w*\s+письм', 'с согласованием страховщика']
  - ['жизненн\w*\s+показани', 'по жизненным показаниям']
  - ['ближайш\w*', 'в ближайшую подходящую больницу']
  - ['догоспитальн\w*\s+обследовани', 'с результатами обследования до госпитализации']
  - ['франшиз\w*', 'с франшизой']
  - ['доплат\w*|за\s+счёт\s+застрахованн|за\s+счет\s+застрахованн', 'с доплатой застрахованного']
  - ['медицинск\w*\s+показани', 'по медицинским показаниям']
  - ['не\s+более\s+\d+\s*(?:раз|посещ|обращ|при[её]м|консультац|вызов)', 'с ограничением по числу обращений']
  - ['не\s+более\s+\d+\s*(?:процедур|сеанс|манипуляц)|\d+\s+(?:процедур|сеанс)', 'с ограничением числа процедур']
  - ['\d+\s+раз\w*\s+в\s+(?:год|течение)', 'ограниченное число раз в год']
  - ['в\s+пределах\s+(?:\d+\s*км|мкад|административн)', 'в пределах зоны обслуживания']
  - ['в\s+офисе\s+страхователя', 'в офисе работодателя']
  - ['при\s+численности', 'при минимальной численности застрахованных']
  - ['неотложн\w*\s+показани', 'по неотложным показаниям']
  - ['ограничени\w*\s+объ[её]ма?\s+услуг', 'в ограниченном объёме']
  - ['по\s+выбору\s+страховщик', 'в клинике по выбору страховщика']
# служебные слова → человеческие (применяются к lead и тексту пунктов)
replace:
  - ['\(матрица видов помощи\)', '(таблица видов помощи программы)']
  - ['\(матрица\)', '(таблица видов помощи программы)']
  - ['в матрице программы', 'в таблице видов помощи программы']
  - ['матриц\w* видов помощи', 'таблица видов помощи программы']
  - ['\(допущение, не условие договора\)', '(допущение)']
  - ['\s*Фрагмент исключений:.*$', '']
  - ['\s*\(пункты выше\)', '']
  - ['\s*—?\s*проверьте пункты ниже', '']
  - ['\bsupports\b', '']
  - ['\bguided\b', '']
# метка допущения «по словарю» (план: вид помощи по словарю — допущение, не условие договора)
assumption_marker: 'по словарю видов помощи'

# caution: одна строка
caution: 'Ответ — по документам договора; окончательное решение по случаю — за страховой компанией.'
caution_assumption: ' Вид помощи для услуги определён по словарю (допущение) — подтвердите в СК.'
caution_extractive: 'Вывода нет: модель недоступна, показаны найденные пункты — проверьте их вручную.'
# вопрос об ОМС: ассистент проверяет только договор ДМС (знаний о правилах ОМС в ответе нет — `docs/rules.md` п. 2)
oms_rx: '\bомс\b|обязательн\w*\s+медицинск\w*\s+страховани'
caution_oms: ' Об ОМС ассистент не отвечает: проверяется только договор ДМС.'
# ответ на «Какая программа?», которого нет среди программ договора
lead_unknown_program: 'Программы «{text}» в договорах нет. {question} Выберите вариант ниже.'
caution_group: ' Условия одного договора на другой не переносятся.'

# ответ менеджера на уточняющий вопрос склеивается с исходным вопросом (followup.py): [вопрос ассистента, шаблон]
followup_glue:
  - ['программ', 'По программе «{text}».']
  - ['клиник', 'В клинике {text}.']
  - ['договор', 'По договору {text}.']

# Ответ на вопрос из «Что уточнить» (кнопка или «свой ответ», followup.clarify_reply): исходный вопрос + факт словами.
# clarify_glue — [начало вопроса (regex, нижний регистр), шаблон]: вопрос о программе / клинике — словами слота.
# clarify_yesno — [начало вопроса «да/нет», шаблон для «да», шаблон для «нет»]: {x} — остаток вопроса без «?»
# («Есть ли направление врача?» + «Да» → «направление врача есть»). Иначе — «<вопрос без ?> — <ответ>.».
clarify_glue:
  - ['^(?:какая|по какой) программ', 'По программе «{text}».']
  - ['^(?:в какой|какая) клиник', 'В клинике {text}.']
  - ['^какую причину отказа', 'Причина: {text}.']
clarify_yes: [да, есть, было, была, были]
clarify_no: [нет, не было, не была, не были]
clarify_yesno:
  - ['^есть ли\s+', '{x} есть', '{x} нет']
  - ['^имеется ли\s+', '{x} есть', '{x} нет']
  - ['^было ли\s+', '{x} было', '{x} не было']
  - ['^была ли\s+', '{x} была', '{x} не была']
  - ['^были ли\s+', '{x} были', '{x} не были']
  - ['^выдано ли\s+', '{x} выдано', '{x} не выдано']
  - ['^получено ли\s+', '{x} получено', '{x} не получено']
  - ['^оформлено ли\s+', '{x} оформлено', '{x} не оформлено']
  - ['^согласовано ли\s+', '{x} согласовано', '{x} не согласовано']

# Расплывчатый вопрос — назван только вид помощи («а зубы?», «стоматология входит?»): ответ по виду помощи и
# варианты уточнения кнопками (compose._narrow, ревизия точности w18). when — леммы вопроса (все леммы услуги
# вопроса должны быть из этого списка); options — готовые вопросы, клик отправляет их как новый вопрос.
narrow_ask: 'Уточните, что именно нужно проверить, — ответ будет точнее:'
narrow_lead: 'Ответ зависит от того, какая именно услуга нужна. Выберите вариант ниже или напишите услугу своими словами.'
# слова, которые не уточняют услугу при проверке расплывчатого вопроса («лечение зубов» — всё ещё «зубы»)
narrow_ignore: [лечение, лечить, помощь, услуга, обслуживание, стоматологический]
narrow_options:
  - when: [стоматология, стоматологический, стоматолог, зуб, зубной, зубы]
    options: ['Входит ли лечение кариеса?', 'Входит ли удаление зуба?', 'Входит ли профессиональная чистка зубов?',
              'Входит ли протезирование зубов?', 'Входит ли лечение пульпита?']
  - when: [диагностика, обследование, исследование, анализ, сдать, сдача, обследоваться]
    options: ['Входит ли МРТ?', 'Входит ли КТ?', 'Входит ли УЗИ?', 'Входит ли общий анализ крови?', 'Входит ли ЭКГ?']
  - when: [врач, специалист, приём, прием, консультация, поликлиника]
    options: ['Входит ли приём терапевта?', 'Входит ли приём невролога?', 'Входит ли приём гинеколога?',
              'Входит ли приём оториноларинголога?', 'Входит ли приём офтальмолога?']
  - when: [стационар, госпитализация, больница]
    options: ['Входит ли плановая госпитализация?', 'Входит ли экстренная госпитализация?',
              'Входит ли дневной стационар?']
