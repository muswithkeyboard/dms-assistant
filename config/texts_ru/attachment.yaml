# Ответ по документу, прикреплённому к чату (ADR 0016, src/dms_core/attachment.py). Шаблоны кода, без модели:
# модель сюда ничего не пишет; в ответ попадают только дословные цитаты пунктов вложения.
version: 1
# сообщение ассистента сразу после загрузки (без модели, по заголовкам документа)
loaded: 'Документ «{title}» загружен — {n} {items}{sections}. Спросите о нём.'
loaded_sections: ' (разделы: {sections})'
loaded_more: 'и ещё {n}'
loaded_hint: >-
  Пока над полем ввода стоит «По документу», вопросы этого чата отвечаются только по нему. ✕ — снова по договору чата.
added: 'Документ также добавлен в документы договора {contract} и участвует в обычных ответах по договору.'
sections_statement: 'Разделы документа «{title}»'
items: [пункт, пункта, пунктов]
# ответ на вопрос по вложению
found: 'В документе «{title}» по вопросу — пункты ниже.'
not_found: >-
  В документе «{title}» не нашлось ничего по вопросу. Переформулируйте вопрос словами документа или снимите отметку
  «По документу» (✕ над полем ввода), чтобы спросить по договору.
caution: 'Ответ — только по прикреплённому документу; условия договора из базы не учитывались.'
point_number: 'Пункт {number}'
point_number_in: 'Пункт {number} ({where})'
point_table: 'Строка таблицы ({where})'
point_plain: 'Фрагмент документа'
point_plain_in: 'Фрагмент документа ({where})'
# кнопки-примеры вопросов: по названиям разделов документа
section_question: 'Что сказано в разделе «{section}»?'
# слова вопроса, по которым пункт документа не ищется (вопросительные и служебные: есть почти в любом вопросе)
question_words: [входить, есть, можно, ли, какой, что, сколько, как, где, когда, кто, сказать, сказано, написать,
                 написано, раздел, документ, пункт, говориться, указать, указано, быть, этот, тот, мочь, нужно,
                 надо, ли, про, весь, всё, или, это, такой, должный]
