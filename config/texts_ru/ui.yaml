automation:
  title: Добавление клиники
  steps_label: Шаги автоматизации
  clinic: 'Клиника: {name}'
  current: текущий шаг
  states:
    alt_found: Альтернатива в программе
    not_in_program: Клиники нет в программе
    hr_wants_add: HR хочет добавить
    awaiting_insurer: Ждём ответа СК
    insurer_free: 'По ответу СК: бесплатно'
    insurer_paid: 'По ответу СК: платно'
    hr_agreed: HR согласовал — ждём подтверждения СК
    insurer_confirmed: СК подтвердила добавление
    hr_declined: HR отказался
    closed: Закрыт
    insufficient: Недостаточно данных
  branch_placeholder: Ответ СК
  # Кнопки следующего действия. Ключи — переходы из config/add_clinic.yaml (тест сверяет оба файла).
  actions:
    hr_wants_add: HR хочет добавить клинику
    insurer_request_ready: Письмо в СК готово — ждём ответа
    insurer_free: 'СК ответила: бесплатно'
    insurer_paid: 'СК ответила: платно'
    hr_agreed: HR согласовал условия
    insurer_confirmed: СК подтвердила добавление
    hr_declined: HR отказался
    close: Завершить
  # Какие кнопки показывать в каждом состоянии — копия transitions из config/add_clinic.yaml (тот заморожен,
  # страница его не получает); tests/ui сверяет, что списки совпадают.
  # копия переходов config/add_clinic.yaml (тест tests/ui сверяет); «закрыть» — с любого шага
  flow:
    alt_found: [close]
    insufficient: [close]
    not_in_program: [hr_wants_add, close]
    hr_wants_add: [insurer_request_ready, close]
    awaiting_insurer: [insurer_free, insurer_paid, close]
    insurer_free: [close]
    insurer_paid: [hr_agreed, hr_declined, close]
    hr_agreed: [insurer_confirmed, close]
    insurer_confirmed: [close]
    hr_declined: [close]
  # действия, у которых есть поле «Ответ СК» (scenarios/add_clinic.py INSURER_ACTIONS)
  reply_actions: [insurer_free, insurer_paid, insurer_confirmed]
  insurer_reply: Ответ СК (вставьте текст письма — сохранится как источник)
  insurer_reply_hint: Ветку «бесплатно / платно» выбираете вы по ответу СК; ассистент её не угадывает.
  confirm_hint: Клиника считается добавленной только после подтверждения СК — вставьте её ответ и нажмите кнопку.
  promise_field: 'Поле «{field}» очищено: в подставленном тексте есть обещание ({phrases}). Ответ СК сохранён как источник — впишите условия своими словами, без сроков и гарантий.'
