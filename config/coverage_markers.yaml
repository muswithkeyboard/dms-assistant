# Маркеры разделов программы ДМС для проверки покрытия в режиме guided (этап w5-coverage, ADR 0009).
# version: 3 (24.10.2026, этап w5-recall: сокращения и специалисты в услуге, услуга из одних уточнений или одной
#   анатомии — «недостаточно», вид действия (лечение ≠ реабилитация ≠ диагностика ≠ профилактика), помощь за рубежом
#   (раздел, ограниченный п. «вне территории РФ», — только для вопросов о загранице), пункт-отсылка не считается
#   просмотром исключений, оговорка исключения — только в своём пункте перечня, условия в ячейках таблиц ГК 3,
#   новые отрицания внутри «входит», словари анатомии и синонимов по текстам программ трёх СК)
# version: 2 (24.10.2026, исправления по ревизии w5-coverage: предок-исключение сильнее вводной пункта,
#   общие слова видов помощи — только в заголовках-предках, оговорки «входит», синонимы услуг, слова процедуры)
#
# Зачем: guided ищет услугу в пунктах программы договора и должен понять, в каком разделе стоит найденный пункт:
#   included  — «входит»: перечень/объём услуг, «программа включает», «оказываются», разделы видов помощи;
#   exclusion — «исключение»: «исключения», «не оплачивается», «не входит», «не является страховым случаем»;
#   condition — «условие»: порядок получения/предоставления, условия оказания, франшиза.
# Раздел определяется по ЗАГОЛОВКАМ пункта (путь в структуре документа, пункт-родитель по номеру, ближайший
# предшествующий заголовок), а не по словам в тексте самого пункта: одно и то же слово бывает в обоих разделах.
# Устройство документов — docs/facts/kit/gk1–3.md:
#   ГК 1 (Зетта): объём помощи — заголовки разделов T11 («Программа "Стандарт". Поликлиническое обслуживание
#     без стоматологии…», «Расширение программы…: … не более 5 раз в год») — это строки матрицы видов помощи;
#     «ОБЪЕМ И ПОРЯДОК ПОЛУЧЕНИЯ МЕДИЦИНСКИХ УСЛУГ» — условия получения;
#   ГК 2 (Ренессанс): «Программа включает», «Объем услуг», разделы видов помощи («Поликлиническое обслуживание»,
#     «Вызов врача на дом в пределах МКАД»), «Исключения из программы», «Исключения из страхового покрытия»,
#     «Страховщик не оплачивает», «Программа не предусматривает оплату», «Порядок получения…», «Условия оказания…»;
#   ГК 3 (СОГАЗ): II «Программа включает в себя», III «Объем медицинских услуг…», IV «Исключения из программы»,
#     VI «Порядок предоставления медицинских услуг», VII «…безусловной франшизы»; таблица услуг приложения
#     («вид | услуга | да / с ограничениями | комментарий») — раздел строки задаёт её ячейка, а не заголовок.
# Регулярные выражения — Python re, без учёта регистра, «ё» заменяется на «е» до сравнения.

version: 3

# Маркеры разделов в заголовке. В одном заголовке проверяются по порядку: exclusion → condition → included
# («не входит» содержит «входит» — поэтому сначала отрицания).
sections:
  exclusion:
    - 'исключени\w*\s+(из|по)\s'
    - '^\W*(\d+[.\d]*\s*)?исключени'
    - 'не\s+оплачива'
    - 'не\s+возмеща'
    - 'не\s+покрыва'
    - 'не\s+входит|не\s+входят|не\s+входящ'
    - 'не\s+включ'
    - 'не\s+предусматрива'
    - 'не\s+является\s+страхов|не\s+являются\s+страхов'
    - 'не\s+относ\w+\s+к\s+страхов'
    - 'освобожда\w+\s+от\s+обязанности'
    - 'отказыва\w*\s+в\s+(страхов\w+\s+)?(выплат|возмещ|оплат)'
    - 'расход\w*,?\s+не\s+возмещ'
  condition:
    - 'порядок\s+(обращени|получени|предоставлени|оказани|организаци)'
    - 'услови\w+\s+(оказани|предоставлени|получени|обслуживани)'
    - 'франшиз'
  # «входит» — только конкретные заголовки перечня («программа включает», «перечень услуг», «оказываются
  # следующие»), а не общие слова: «приемы, консультации и манипуляции … по:» — вводная пункта ИСКЛЮЧЕНИЙ 4.2.2 ГК 3
  included:
    - 'включа\w*(\s+в\s+себя)?\s*:'
    - '(программ\w*|полис\w*|страховани\w*)\s+(\w+\s+){0,3}включа'
    - 'входит|входят'
    - 'предусматрива'
    - 'объ?ем\w*\s+(медицинск\w+\s+)?(помощи|услуг)'
    - 'перечень\s+(медицинск\w+\s+)?услуг'
    - 'услуги,?\s+(предоставляем|оказываем)'
    - 'оказыва\w*тся'
    - 'страхов\w+\s+случа\w+\s+(является|являются)'
    - 'расширени\w*\s+программ'

# Заголовки разделов видов помощи (ГК 2, ГК 3: «Поликлиническое обслуживание», «Вызов врача на дом в пределах
# МКАД», «Инструментальные исследования») — «входит», но ТОЛЬКО как заголовок-предок пункта (сегмент пути,
# пункт-родитель, предшествующий заголовок) не длиннее care_heading_words слов; вводная самого пункта по ним
# раздел не получает. Исключение-предок всё равно сильнее (см. guided._Sections.section).
included_care_headings:
  - 'поликлиническ|амбулаторн'
  - 'стационар'
  - 'стоматологическ'
  - 'на\s+дому|вызов\s+врача'
  - 'скорая|неотложн'
  - 'лабораторн|инструментальн|диагностическ'
  - 'восстановительн|реабилитац'
  - 'медицинский\s+осмотр|чек-?ап'
care_heading_words: 10

# Ячейка строки таблицы услуг → раздел (ГК 3). «нет» — «не входит», но это не пункт исключений: exclusion=yes
# из неё не ставится (осторожно), строка показывается как ограничение.
table_cells:
  included: ['да', 'входит', 'включено', '+']
  limited: ['с ограничениями', 'ограниченно']
  negative: ['нет', 'не входит', 'не включено', '-', '—']

# Отрицание в тексте найденного фрагмента раздела «входит» — фрагмент не даёт care_in_program=yes.
text_negation:
  - 'не\s+входит|не\s+входят'
  - 'не\s+включ'
  - 'не\s+оплачива'
  - 'не\s+покрыва'
  - 'не\s+предусм'
  - 'не\s+является\s+страхов'
  # «…не представляется возможной», «…не оказывается / не предоставляется / не проводится» внутри перечня «входит»
  - 'не\s+представля\w*\s+возможн'
  - 'не\s+оказыва'
  - 'не\s+предоставля'
  - 'не\s+проводит|не\s+проводят'
  - 'не\s+осуществля'

# Оговорка внутри пункта исключений: такое совпадение — УСЛОВИЕ (other), а не исключение. «Страховщик не
# оплачивает КТ, МРТ, за исключением случаев, когда …» значит: в части случаев услуга оплачивается, значит
# «нельзя» из пункта не следует; ответ — «при условиях / нужна проверка» с обоими фрагментами (`docs/rules.md` п. 2).
# То же для пунктов, где исключение действует только при обстоятельстве («при отсутствии…», «если…»,
# «без медицинских показаний», «по желанию»): из такого пункта «нельзя» тоже не следует без фактов обращения.
caution:
  - 'за\s+исключением'
  - '\bкроме\b'
  - '\bесли\b'
  - 'предусмотренн\w+\s+(настоящей\s+)?программ'
  - 'исключение\s+составля'
  - 'при\s+отсутствии'
  - 'без\s+(медицинских\s+)?показаний'
  - 'по\s+желанию'
  - 'чаще,?\s+чем'
  - 'при\s+наличии'
  - 'у\s+лиц,?\s+(не\s+)?(прошедш|имеющ|страдающ)'
  - 'если\s+не'
  - '\bпри\s+условии'
  - 'в\s+случае,?\s+(если|когда)'
  # исключение по признаку самого застрахованного (инвалидность 1–2 группы, «с даты установления…»): действует,
  # только если признак есть, — без этого факта «нельзя» не следует (условие other, фрагмент на экране)
  - 'инвалидност'
  - 'с\s+(даты|момента)\s+установлени'

# Оговорка внутри пункта раздела «входит»: услуга входит не целиком — условие other («при условиях»), а не
# чистое «входит». «Первичная консультация … без …», «в объеме 2 тестов», «за исключением …».
included_caution:
  - 'за\s+исключением'
  - '\bкроме\b'
  - '\bбез\b'
  - '\bтолько\b'
  - 'первичн(?!\w*\s+и\s+повторн)'
  - 'в\s+объ?еме\s+\d'
  - 'при\s+наличии'
  - 'по\s+показаниям|по\s+медицинским\s+показаниям'
  - 'по\s+желанию'

# Виды условий (словарь Checks.conditions) по тексту фрагмента и его заголовкам.
condition_kinds:
  franchise: ['франшиз']
  referral: ['по\s+направлени', 'направлени\w+\s+(лечащего\s+)?врача']
  approval: ['согласовани', 'согласованн']
  limit: ['не\s+более\s', 'однократно', 'в\s+объ?еме\s+\d', 'не\s+чаще', '\b\d+\s*раз\w*\b', '\bраз\s+в\s+(год|месяц|квартал|период)', 'лимит']
  zone: ['в\s+пределах\s+\d', 'в\s+пределах\s+(мкад|кад|административн|границ|город|населенн|\d+\s*км)',
         '\d+\s*км\s+от', 'за\s+пределами\s+(мкад|кад)']
  # условия в ячейках строк таблиц ГК 3 и в тексте пунктов: «при наличии медицинских показаний», «по показаниям»,
  # «в случае поездки в регион…», «с ограничениями» (ячейка limited даёт limit — guided._cell_section)
  other: ['при\s+наличии\s+в\s', 'при\s+условии', 'при\s+наличии\s+(медицинских\s+)?показани',
          'по\s+(медицинским\s+)?показани', 'в\s+случае\s+(поездки|выезда|командировки|нахождения)',
          'по\s+решению\s+(врача|страховщика)']

# Совпадение услуги: значимые слова услуги (леммы → основы). Слова ситуации обращения, а не услуги, не
# учитываются; общие слова ДМС («прием», «врач», «консультация») — список _GENERIC в guided.py.
service:
  noise: [срок, раз, год, месяц, неделя, день, случай, сотрудник, сотрудница, застрахованный, клиника, отказ,
          условие, новый, этот, тот, свой, весь, который, страховой, страховая, дмс, полис, карта, причина,
          жалоба, однократный, повторный, мкад, кад]
  # граммемы pymorphy, которые не бывают названием услуги: география, имена, порядковые и количественные
  noise_grammemes: [Geox, Name, Surn, Patr, Anum, NUMR]
  # слова вида помощи / специалиста, уточняющие контекст, но не саму услугу («стоматолог предлагает герметизацию
  # фиссур» — услуга «герметизация фиссур»): необязательны при совпадении, если у услуги есть другие слова
  context_words: [стоматолог, стоматология, стоматологический, зуб, зубной, поликлиника, поликлинический,
                  амбулаторный, стационар, стационарный, медцентр, центр, больница, специалист, лечащий,
                  роддом, кабинет, процедурный, отделение]
  # место исследования/процедуры (анатомия), уточняющее услугу, но не меняющее её вид: «МРТ колена», «УЗИ
  # щитовидной железы» — в программах МРТ и УЗИ перечислены без области. Необязательны, как context_words, если у
  # услуги есть другие слова; заболевания («новообразования головного мозга») — не место: слова болезни остаются
  # обязательными, а исключение без слов процедуры даёт только оговорку (procedure_words)
  anatomy_words: [
    # опорно-двигательный аппарат и конечности
    колено, коленный, сустав, суставной, позвоночник, шейный, поясничный, грудной, плечевой, плечо, локоть,
    локтевой, запястье, тазобедренный, голеностопный, конечность, кисть, стопа, нога, рука, бедро, голень, спина,
    # голова и шея
    голова, головной, мозг, шея, челюсть, челюстной, лицо, лицевой,
    # органы и системы
    щитовидный, железа, молочный, брюшной, таз, сердце, сердечный, сосуд, сосудистый, вена, венозный, артерия,
    лёгкое, легкое, легочный, печень, почка, почечный, желудок, кишечник, кишка, пищевод, мочевой, пузырь, матка,
    яичник, предстательный, глаз, глазной, ухо, горло, нос, носовой, пазуха, кожа, кожный, десна]
  # специалист по окончанию леммы («гастроэнтеролог», «психиатр», «хирург», «физиотерапевт»): кто назначил или
  # оказывает услугу — необязательное слово, как context_words; услуга только из специалиста («прием психиатра»)
  # остаётся обязательной
  specialist_suffixes: [олог, иатр, хирург, терапевт, ортопед, ортодонт, окулист, гигиенист, педиатр, логопед,
                        уролог, акушер]
  # предлоги уточнения услуги («имплантация зубов ПОСЛЕ удаления», «анализ НА ВПЧ»): слова после них — уточнения;
  # услуга, у которой обязательными остались одни уточнения (главное слово потеряно), — «недостаточно»
  qualifier_preps: [после, при, для, от, против, на, под]
  # вид действия услуги (леммы → основы по началу слова): если у услуги он назван, а во фрагменте до слов услуги
  # назван только ДРУГОЙ вид действия, совпадения нет («лечение ковида» ≠ «реабилитация после COVID-19»,
  # «вакцинация от гепатита» ≠ «лечение гепатита», «диагностика бесплодия» ≠ «лечение бесплодия»)
  actions:
    treatment: [лечени, лечить, лечебн, терапи]
    rehabilitation: [реабилит, восстановит, восстановлен]
    diagnostics: [диагност, обследован, исследован, анализ, скрининг]
    prevention: [профилакт, вакцин, привив, иммунопрофилакт]
  # слова, которыми называют ВЕСЬ вид помощи, а не отдельную услугу. Если услуга названа только ими и вид помощи
  # в матрице программы есть, пункт исключений, где слово лишь упомянуто («организация стационара на дому»), не
  # делает вид помощи исключённым: показывается как ограничение, exclusion=yes не ставится
  care_level_words: [стационар, стационарный, госпитализация, стоматология, стоматологический, поликлиника,
                     поликлинический, амбулаторный, скорая, дом, вызов, телемедицина, реабилитация]
  # при n значимых словах услуги допускается пропуск одного, если n ≥ allow_missing_from
  allow_missing_from: 4
  # «о чём» фрагмент: слова услуги — в первых lead_words словах фрагмента раздела «входит» / «условие»
  # и в первых exclusion_lead_words словах фрагмента исключений (иначе пункт о другой услуге, где наша — лишь
  # упомянута: «подготовка к плановой госпитализации при отсутствии…»)
  lead_words: 20
  exclusion_lead_words: 10
  # слова процедуры (как проверяют), а не того, ЧТО проверяют или лечат: «анализы на ВИЧ», «УЗИ при беременности»,
  # «МРТ при онкологии». В разделе «входит» обязательны, как все слова услуги. В разделе «исключение» совпадение
  # без них («ВИЧ – инфекция…», «Медицинские услуги, связанные с беременностью…») — только ОГОВОРКА (условие
  # other, оба фрагмента), а не exclusion=yes: «МРТ головного мозга» ≠ «новообразования головного мозга».
  procedure_words: [анализ, исследование, обследование, диагностика, узи, мрт, кт, рентген, томография, экг,
                    ультразвуковой, лабораторный, инструментальный, процедура, манипуляция, операция, вмешательство,
                    терапия, курс, сеанс, введение, вакцинация, прививка, госпитализация, стационар]
  # рубрика строки таблицы / заголовок пункта, которые сами называют процедуру: услуга «анализ на ПСА» названа
  # строкой «лабораторная диагностика | ПСА общий | да» (слово «анализ» — в рубрике), «УЗИ щитовидной железы» —
  # пунктом под заголовком «Ультразвуковые исследования:»
  procedure_headings: ['диагност', 'исследовани', 'лаборатор', 'анализ', 'обследовани']
  # синонимы услуг (лексика медицины, не выводы): услуга с одной фразой группы ищется и по остальным
  # (противоречие «входит: ЗППП» и «исключение: венерические заболевания» видно только так)
  synonyms:
    # фразы — так, чтобы основы слов совпадали с формами текста («путем» → «путь» с текстом не сходится)
    - [зппп, иппп, передающиеся половым, венерические]
    - [коронавирусная инфекция, covid, ковид]
    # из текстов программ трёх СК (как называют услугу в документах) и разговорные формы менеджера
    - [прививка, вакцинация, иммунопрофилактика]
    - [импланты, имплантация]
    - [уколы, инъекции]
    - [капельницы, капельные инфузии]
    - [больничный лист, листок нетрудоспособности, экспертиза нетрудоспособности]
    - [гастроскопия, эзофагогастродуоденоскопия, фгдс]
    - [чистка зубов, удаление зубных отложений, гигиена полости рта]
    - [брекеты, брекет-система, ортодонтическое лечение]
    - [вмс, внутриматочная спираль]
    - [лфк, лечебная физкультура]
    # специалист ↔ метод (w5-recall2): «мануальный терапевт: четвёртая процедура» — о мануальной терапии
    - [мануальная терапия, мануальный терапевт]
    - [иглорефлексотерапия, рефлексотерапия, рефлексотерапевт, иглоукалывание]
  # слова услуги в одном пункте перечня исключений (части фрагмента между «,;:()–»): все найденные — в первых
  # item_lead_words словах одной части («…в профилактических целях: герметизация фиссур, …, реставрация зубных
  # рядов» — о каждой из услуг перечня, хотя она дальше exclusion_lead_words слов от начала пункта; 4 — чтобы
  # уместились определения перед услугой: «лазерное и другое отбеливание зубов»)
  item_lead_words: 4
  # сокращения услуг ↔ полные названия (лексика медицины, не выводы); совпадение — по любому варианту
  abbreviations:
    мрт: магнитно-резонансная томография
    кт: компьютерная томография
    узи: ультразвуковое исследование
    экг: электрокардиография
    фгдс: фиброгастродуоденоскопия
    лфк: лечебная физкультура
    чек-ап: медицинский осмотр
    ээг: электроэнцефалография
    эхокг: эхокардиография
    уздг: ультразвуковая допплерография
    пэт: позитронно-эмиссионная томография
    впч: папилломавирус
    пса: простатспецифический антиген
    асит: аллерген-специфическая иммунотерапия
    увт: ударно-волновая терапия

# Поиск назад по документу (ближайший предшествующий заголовок, когда путь плоский — ГК 2): не дальше стольких
# пунктов; встреченный заголовок исключений останавливает поиск (раздел «исключение» — только по своему пути).
lookback: 80
# Сколько утверждений каждого рода (входит / условие) показывать на одну услугу
max_statements: 3

# Помощь за рубежом (ГК 3: п. 3.5 «…вне территории Российской Федерации…» и раздел 4.3 «В отношении … услуг,
# предусмотренных п. 3.5 …»). «ВЗР» в названии программы ГК 1 маркером не служит: программа включает и
# помощь в России. Пункт, у которого заголовок-предок (или пункт, на
# который заголовок ссылается: «предусмотренных п. 3.5») относится к загранице, применяется только к вопросу о
# помощи за рубежом — и «входит», и «исключение». Вопрос о загранице — по маркерам question.
abroad:
  scope:
    - 'вне\s+территории\s+(российской|рф)'
    - 'за\s+пределами\s+(территории\s+)?(российской|рф)'
    - 'за\s+рубеж'
    - 'выезжающ\w+\s+за\s+(рубеж|пределы)'
  question:
    - 'за\s+рубеж|за\s+границ|заграниц|зарубежн'
    - 'вне\s+(территории\s+)?(россии|рф|российской)|за\s+пределами\s+(россии|рф)'
    - 'в\s+(отпуске|поездке|командировке)\s+(за|в\s+другой\s+стране)'
    - '\bвзр\b'
    - 'в\s+поездк\w*\s+за\s+(границ|рубеж)|за\s+границу'
  # страны (леммы pymorphy): «в Турции», «в Израиле» — вопрос о помощи за рубежом (guided.question_abroad)
  countries: [турция, израиль, египет, таиланд, тайланд, оаэ, эмираты, китай, индия, вьетнам, грузия, армения,
              абхазия, казахстан, беларусь, белоруссия, узбекистан, киргизия, кипр, греция, италия, испания,
              франция, германия, чехия, австрия, швейцария, финляндия, болгария, черногория, сербия, тунис,
              мальдивы, шри-ланка, индонезия, бали, куба, доминикана, мексика, сша, америка, великобритания,
              англия, япония, корея, монголия, азербайджан, таджикистан, латвия, литва, эстония, польша,
              венгрия, хорватия, португалия, нидерланды, бельгия, норвегия, швеция, дания, катар, иордания]
  # ссылка заголовка на пункт с ограничением области: «услуг, предусмотренных п. 3.5»
  reference: 'предусмотренн\w*\s+(?:п\.|пп\.|пункт\w*)\s*(\d+(?:\.\d+)*)'

# Пункт-отсылка: «исключения указаны в п. 4 Правил», «в соответствии с разделом IV» — короткий пункт, который
# только отсылает к другому тексту. Он не подтверждает, что исключения просмотрены (exclusion=absent не ставится).
reference_only:
  max_words: 40
  patterns:
    - '(указан\w*|предусмотрен\w*|установлен\w*|перечислен\w*|определ[её]н\w*|приведен\w*|изложен\w*)\s+(\w+\s+){0,3}(в|во)\s+(п\.|пп\.|пункт|раздел|правил|приложени|статье|памятк)'
    - '(согласно|в\s+соответствии\s+с|см\.)\s+(\w+\s+){0,2}(п\.|пп\.|пункт|раздел|правил|приложени)'

# Лимит обращений исчерпан (guided.limit_exceeded, этап w5-recall2 — после ревизии: 3 ложных «нельзя» без учёта
# периода, вида услуги и того, что посчитано). В вопросе — N-е обращение («шестой приём», «6-й сеанс», «уже 5 раз»,
# «11-я жемчужная ванна»), в пункте перечня с услугой — лимит M; N > M → «нельзя» со ссылкой на лимит, только если
# совпали услуга (лимит — в той же части пункта между «;», что и все слова услуги), единица (unit_classes +
# compatible) и период (periods), счёт однозначен и нет сброса счёта (reset). Иначе лимит — условие.
limit_exceeded:
  # ВЫКЛЮЧЕНО автором 25.10.2026 по ревизии 4 (2 ложных «нельзя»: лимит «каждого вида», лимит другого
  # раздела) — превышение лимита только условие. Включать (true) — после исправлений и новой ревизии.
  deny: false
  # классы единиц счёта (по началу слова); «раз» — любой
  unit_classes:
    any: [раз]
    visit: [прием, приём, консультац, визит, посещени, обращени]
    procedure: [процедур, сеанс, заняти, манипуляц, инъекц, вливани]
    objects: [образовани, новообразовани, единиц]
  # с чем ещё совместим класс единицы вопроса (service — слово услуги после числа: «4-ю папиллому», «11-я ванна»)
  compatible:
    service: [procedure, objects]
    procedure: [service]
    objects: [service]
  # лимиты в тексте пункта: n — число, unit — единица, one — «однократно» (= 1)
  limits:
    - 'не\s+более\s+(?P<n>\d{1,3})\s*(?:\(\w+\)\s*)?(?P<unit>раз|при[её]м|визит|сеанс|процедур|консультац|посещени|обращени|заняти|образовани|манипуляц)\w*'
    - '\bдо\s+(?P<n>\d{1,3})\s*(?:\(\w+\)\s*)?(?P<unit>раз|при[её]м|визит|сеанс|процедур|консультац|посещени|обращени|заняти|образовани)\w*'
    - '(?<![\d.,])(?P<n>\d{1,2})\s*(?:\(\w+\)\s*)?(?P<unit>раз)(?:а)?\b'
    - '(?P<one>однократн)\w*'
  # периоды: в тексте лимита (после числа) и в вопросе; первое совпадение по порядку
  periods:
    other: ['в\s+\d+\s+(год|года|лет|месяц)', 'раз\s+в\s+(неделю|месяц|квартал|полгода)', 'в\s+(неделю|месяц|квартал)\b']
    course: ['курс']
    hospital: ['госпитализац', 'пребывани\w*\s+в\s+стационар']
    month: ['месяц', 'недел']
    year: ['\bгод', 'срок\w*\s+(страховани|действи)', 'период\w*\s+страховани']
  # сброс счёта в вопросе: новый курс / год / госпитализация, другой год числом — не сравнивается
  reset:
    - '\b(втор|трет|нов|друг|следующ|очередн|повторн)\w*\s+(курс|госпитализац|год|период|полис|случа)'
    - '\b(19|20)\d\d\b'
    - 'в\s+этом\s+году\s+(первый|первая|первое|1)'
  # слова, при которых число — не обращения («уже 6 раз звонили», «записывались 3 раза»)
  not_visits: 'звон|дозвон|позвон|пытал|записыва|записал'
  ordinals: {перв: 1, втор: 2, трет: 3, четверт: 4, пят: 5, шест: 6, седьм: 7, восьм: 8, девят: 9, десят: 10,
             одиннадцат: 11, двенадцат: 12, тринадцат: 13, четырнадцат: 14, пятнадцат: 15}

# «Можно» не ставится, если в обращении клиника отказала, требует оплату или сказала, что услуга / специалист по ДМС
# не оказывается (guided.allowed_blocker): в договорах есть правило «приём специалистом, не ведущим приём по ДМС, или
# с доплатой — не страховой случай», и такой отказ может быть правомерным — нужна проверка причины, а не «можно».
# Этап w5-strict: маркеры отказа берутся из config/route_markers.yaml refusal (один список с маршрутизатором; прежние
# шаблоны «по ДМС не ведёт», «только за свой счёт / платно», «доплата» перенесены туда или уже были там). Здесь —
# только дополнительные шаблоны, которых нет среди маркеров отказа.
allowed_blockers: []

# Разделы видов помощи (guided.section_care): ближайший заголовок цепочки пункта, названный видом помощи, задаёт вид
# раздела (коды — config/care_types.yaml). Вопрос о виде помощи X берёт «входит», условия и исключения только из
# общих разделов и разделов X (и связанных по part_of): приём невролога — не из «Помощь на дому в пределах 30 км»
# и не из «Телемедицины»; раздел с question — только к вопросу, где есть эти слова («АПТЕКА»: исключение
# «препараты для лечения бесплодия» — не основание «нельзя» для «лечения бесплодия»). Порядок важен: первое
# совпадение («Поликлиническое обслуживание без стоматологии» — поликлиника).
care_sections:
  pharmacy:
    headings: ['аптек', 'лекарственн\w+\s+(обеспечени|средств|препарат)']
    question: ['лекарств', 'препарат', 'аптек', 'таблет', 'рецепт', 'медикамент']
  telemed: ['телемедицин', 'дистанционн\w+\s+(консультац|медицин)', 'онлайн-?\s*консультац']
  home: ['на\s+дому', 'вызов\w*\s+(врача|специалист)', 'врач\w*\s+на\s+дом']
  emergency: ['скор\w+\s+(и\s+неотложн\w+\s+)?(медицинск\w+\s+)?помощ', '^\W*(\d+[.\d]*\s*)?неотложн']
  checkup: ['медицинск\w+\s+осмотр', 'чек-?ап', 'диспансеризац', 'профилактическ\w+\s+осмотр', '^\W*профилактика\W*$']
  outpatient: ['поликлиническ', 'амбулаторн']
  dental: ['стоматологическ', '^\W*(\d+[.\d]*\s*)?стоматологи']
  inpatient: ['стационарн\w+\s+(обслуживани|помощ|лечени)', '^\W*(\d+[.\d]*\s*)?стационар', 'госпитализац']
  rehab: ['восстановительн\w+\s+лечени', 'реабилитац']

