# Способ оказания помощи и классы услуг — выбор строки матрицы видов помощи под услугу вопроса (guided.check_care).
# version: 1 (26.10.2026, этап w12-care; НОВЫЙ файл — утверждает автор, добавить в config.CONFIG_FILES).
#
# modes — способ оказания: строка матрицы «Программа Телемедицина: … дежурного терапевта» — дистанционная помощь,
#   «Вызов врача на дом» — на дому, «Стационарное обслуживание» — в стационаре. Способ строки и вопроса
#   определяется по шаблонам patterns (регулярные выражения по тексту в нижнем регистре, «ё» → «е»); упоминание
#   после «без / кроме / за исключением / исключая» (negation) способа не задаёт («Поликлиническое обслуживание
#   без вызова врача на дом» — не помощь на дому). Вопрос без слов способа берёт способ из вида помощи слота
#   care_type (care_modes); иначе он «очный» (in_person): не совпадает только со строкой, где все способы —
#   дистанционные. Строка без слов способа («Диагностика», «Стоматологическое обслуживание») подходит любому вопросу.
#   Строка другого способа «входит» по вопросу не даёт — только справка «найден вид помощи …, но он …».
# service_classes — классы услуг (words — леммы слов и фраз, совпадение по леммам текста). Узкая строка матрицы
#   «в объёме лабораторных исследований / только анализы» (narrow) подтверждает только услуги классов, названных
#   после маркера; услуга другого класса (МРТ — инструментальная диагностика) по ней «входит» не получает.
#   Слова после «по направлению / по назначению …» (scope_ignore) — порядок, а не объём строки.
#   generic — общие слова класса: объём, названный только ими («в объёме лабораторных исследований»), подтверждает
#     любую услугу класса; объём-перечень («2 инструментальных исследования (флюорография, ЭКГ)») — только
#     названные в нём услуги.
#   include_route_words — добавить к словам класса route_words вида помощи config/care_types.yaml (специалисты).
# version: 2 (26.10.2026, этап w14-refusal; утверждает автор): разделы procedures и procedure_classes —
#   словарь процедур для разбора отказа клиники (guided.refusal_analysis, scenarios/route.service_phrase).
#   Связь «процедура → класс → вид помощи матрицы» — ДОПУЩЕНИЕ словаря, не условие договора: на экран — с
#   пометкой «по словарю видов помощи», метку SC 01 (Checks) не меняет. Разделы modes / service_classes выше
#   не тронуты (выбор строки матрицы check_care работает как прежде).
# version: 3 (26.10.2026, этап w14-fix по ревизии 8; утверждает автор): procedures — after_negation, typo,
#   not_service, generic; procedure_classes — новые классы (dental, reproductive, vaccination, dialysis,
#   cardiovascular, plastic, vision_correction, diagnostics), major / minor (масштаб процедуры → вид помощи),
#   skip_care (вместо правила «вид помощи слота не из care класса»), exclusion_words — только слова самого класса;
#   order_skip / order_prefer — выбор пункта о порядке госпитализации. Разделы modes / service_classes не тронуты.
version: 3
negation: '(?:без|кроме|за\s+исключением|исключая)\s+[^,;:()]*'
modes:
  telemed:
    name: дистанционную консультацию (телемедицину)
    patterns: ['телемедицин', 'онлайн', 'on-?line', 'дистанцион', '(?:через|по)\s+(?:сеть\s+)?интернет',
               'видео\s*(?:связ|консульт|звон)', 'дежурн\w*\s+(?:врач|терапевт|педиатр|доктор)', 'пульт']
  home:
    name: помощь на дому
    patterns: ['на\s+дом(?:у|е)?(?![\wа-я])', 'врач\w*\s+на\s+дом', 'вызов\w*\s+(?:врача|терапевта|педиатра|доктора)']
  inpatient:
    name: стационарную помощь
    patterns: ['стационар(?!озамещ)', 'госпитализац']
  emergency:
    name: скорую помощь
    patterns: ['скор\w*\s+(?:медицинск\w*\s+)?помощ', '(?<![\wа-я])смп(?![\wа-я])', '(?<![\wа-я])скорую(?![\wа-я])']
  outpatient:
    name: очный приём в поликлинике
    patterns: ['поликлини', 'амбулатор', 'при[её]м\w*', 'очн\w*\s+(?:при[её]м|консультац|визит)']
in_person_name: очную помощь
# способ вопроса по виду помощи слота care_type (код config/care_types.yaml), если в вопросе нет слов способа
care_modes: {telemed: telemed, home: home, inpatient: inpatient, emergency: emergency, outpatient: outpatient}
narrow: '(?:в\s+объ[её]ме|только|исключительно|ограничива\w*|ограничен\w*)'
scope_ignore: '(?:по|после)\s+(?:направлени|назначени|согласовани)\w*\s+[\wа-я]+(?:\s+[\wа-я]+)?'
service_classes:
  lab:
    name: лабораторные исследования (анализы)
    words: [анализ, лабораторный, лаборатория, кровь, моча, кал, мазок, ПЦР, биохимический, биохимия, гормон,
            посев, цитологический, гистологический, серологический, иммунологический, коагулограмма, онкомаркер]
    generic: [анализ, лабораторный, лаборатория]
  instrumental:
    name: инструментальную диагностику (МРТ, КТ, УЗИ, рентген, ЭКГ)
    words: [МРТ, КТ, УЗИ, рентген, рентгенография, рентгенологический, рентгеновский, ЭКГ, ЭхоКГ, ЭЭГ, холтер,
            томография, томограф, ультразвуковой, допплерография, дуплексный, эндоскопия, эндоскопический,
            гастроскопия, колоноскопия, ФГДС, ФГС, бронхоскопия, маммография, флюорография, денситометрия,
            электрокардиография, электроэнцефалография, спирография, инструментальный, ортопантомограмма]
    generic: [инструментальный]
  doctor:
    name: приём врача
    words: [приём, консультация, осмотр, визит]
    generic: [приём, консультация, осмотр, визит, специалист, врач-специалист]
    include_route_words: [outpatient]
  procedures:
    name: процедуры и восстановительное лечение
    words: [массаж, физиотерапия, физиотерапевтический, физиолечение, ЛФК, процедура, мануальный терапия,
            иглорефлексотерапия, рефлексотерапия, ударно-волновой, УВТ, инъекция, капельница, перевязка, остеопатия]
    generic: [процедура]
  dental:
    name: стоматологическую помощь
    words: [стоматологический, стоматология, стоматолог, зуб, кариес, пломба, пульпит, пародонтит]
    generic: [стоматологический, стоматология]
  vaccination:
    name: вакцинацию
    words: [вакцинация, вакцина, прививка, иммунизация]
    generic: [вакцинация, вакцина, прививка, иммунизация]

# ---------------------------------------------------------------- процедуры (этап w14-refusal, v3 — w14-fix)
# procedures — как назвать процедуру в слоте услуги (scenarios/route.service_phrase):
#   verbs — лемма глагола (инфинитив pymorphy) → название процедуры: «отрезать ногу» → «ампутация ноги»,
#     «вырезать аппендицит» → «удаление аппендицита»; прямое дополнение — вторым словом в родительном падеже.
#     Глагол словаря после отрицания («не дали отрезать», «не стали оперировать», «не госпитализировали») или
#     перед отрицанием с модальным словом (after_negation: «резать не будем») — ещё и маркер отказа (слот refusal,
#     сценарий SC 01). not_done — «не сделали / не поставили / не берут» при слове класса процедуры в вопросе
#     («ампутацию пальца не сделали», «капельницу не поставили», «не берут на гемодиализ») — тоже маркер отказа.
#   fuzzy — опечатка в глаголе («атрезать»): сходство с глаголом словаря не ниже порога (rapidfuzz ratio), слово
#     не короче fuzzy_min букв.
#   typo — опечатка в слове вопроса («апперации», «ампутацыю», «больнитсу», «госпитализацыи», «атказали»,
#     «прооперирвали»): слово, которого нет в словаре pymorphy, со строчной буквы, не короче min букв, заменяется
#     формой слова словаря (глаголы verbs, слова классов procedure_classes, words ниже — все формы pymorphy) со
#     сходством не ниже ratio. Только для разбора слотов (route.rule_slots), текст обращения не меняется.
#   synonyms — другие названия той же процедуры в документах (леммы фразы услуги → варианты): поиск пунктов.
#   refusal — шаблоны отказа без глагола-процедуры (регулярные выражения, нижний регистр, «ё» → «е»): «не
#     положили в больницу», «не взяли в реанимацию», «не перевели в реанимацию»; совпадение — слот refusal.
#   not_service — кто и где отказал (специалист, учреждение) и обстоятельства, а не услуга: при отказе или
#     процедуре в вопросе такие слова из слота услуги убираются («ампутация хирург стопы» → «ампутация стопы»,
#     «роддом роды» → «роды»), если в слоте остаётся другое слово. Специалисты — ещё и route_words
#     config/care_types.yaml («гинеколог», «хирург»).
#   generic — общие слова процедуры («операция», «удаление»): не называют саму процедуру — по ним одним
#     исключение программы не считается относящимся к случаю (guided._class_exclusions).
procedures:
  verbs:
    отрезать: ампутация
    ампутировать: ампутация
    отнять: ампутация
    отнимать: ампутация
    вырезать: удаление
    удалить: удаление
    удалять: удаление
    иссечь: иссечение
    иссекать: иссечение
    оперировать: операция
    прооперировать: операция
    резать: операция
    зашить: наложение швов
    зашивать: наложение швов
    шить: наложение швов
    загипсовать: наложение гипса
    гипсовать: наложение гипса
    накладывать: наложение
    наложить: наложение
    вскрыть: вскрытие
    вскрывать: вскрытие
    вправить: вправление
    вправлять: вправление
    рожать: роды
    родить: роды
    госпитализировать: госпитализация
    класть: госпитализация
    реанимировать: реанимация
    прокапать: капельница
    капать: капельница
    перелить: переливание
    переливать: переливание
    привить: вакцинация
    прививать: вакцинация
  fuzzy: 85
  fuzzy_min: 6
  not_done: '(?<![а-яё])не\s+(?:сделал\w*|провел\w*|провели|выполнил\w*|поставил\w*|берут|взяли|приняли|принимают)(?![а-яё])'
  after_negation: '\s+не\s+(?:будем|будут|будет|буду|станем|станут|стали|стал|стала|хотят|хочет|хотели|захотел\w*|согласил\w*|могут|может)(?![а-яё])'
  typo:
    ratio: 80
    min: 7
    words: [отказать, отказывать, операция, больница, госпитализация, стационар, реанимация, капельница,
            перелом, грыжа, аппендицит, мениск]
  synonyms:
    удаление аппендицит: [удаление аппендикса, аппендэктомия]
    удаление аппендикс: [аппендэктомия]
    удаление желчный пузырь: [холецистэктомия]
    удаление миндалина: [тонзиллэктомия]
    ампутация: [ампутация конечности]
    капельница: [инфузионная терапия, внутривенное капельное введение]
    наложение гипса: [гипсовая повязка, иммобилизация]
    роды: [родоразрешение]
    ЭКО: [экстракорпоральное оплодотворение, вспомогательные репродуктивные технологии]
    гемодиализ: [экстракорпоральные методы лечения]
    прививка: [вакцинация]
    имплантация зуб: [зубопротезирование]
  refusal:
    - 'не\s+(?:\w+\s+){0,2}?(?:положил\w*|клал\w*|взял\w*|госпитализир\w*|перевел\w*|перевест\w*)\s+(?:\w+\s+)?(?:в|во)\s+(?:больниц|стационар|реанимац|реанимашк|орит|роддом|родильн|отделени)'
    - '(?:в|во)\s+(?:больниц|стационар|реанимац|реанимашк|орит|роддом)\w*\s+(?:\w+\s+)?не\s+(?:положил\w*|взял\w*|госпитализир\w*|приня\w*|перевел\w*)'
  # refusal_service — услуга, если по шаблону refusal в слоте осталось только место («не положили в больницу»)
  refusal_service: госпитализация
  not_service: [хирург, врач, доктор, медсестра, медбрат, больница, клиника, гкб, роддом, травмпункт, поликлиника,
                приёмный покой, покой, контракт, момент, последний, чел, бабки, бабка, сотрудник, жена, муж, показание]
  generic: [операция, оперативный, оперировать, хирургический, хирургия, вмешательство, удаление, удалить,
            иссечение, резекция, вскрытие, наложение, лечение, терапия, процедура, проведение, госпитализация,
            стационар, стационарный, показание, медицинский, плановый, экстренный, повторный, лазерный,
            пластика, коррекция, услуга, введение, метод, после, перед, через, около, кроме, между, против, без,
            для, при, обследование]

# procedure_classes — классы процедур: основной — класс слова, которое стоит в услуге раньше («операция варикоза,
#   говорят косметика» — хирургия, а не эстетика), при равенстве — первый по порядку здесь; остальные совпавшие
#   (и совпавшие только по словам вопроса) дают свои слова исключений: words — леммы слов и фраз (совпадение по леммам услуги, затем вопроса);
#   care — виды помощи матрицы (коды config/care_types.yaml), в рамках которых процедура оказывается, — по порядку
#   важности (первый найденный в матрице — в краткий вывод); вид помощи слота вопроса из этого списка — первым;
#   major — процедура масштаба стационара (ампутация, холецистэктомия, эндопротезирование, шунтирование): только
#     вид помощи major_care, даже если в вопросе названо амбулаторное слово;
#   minor — амбулаторная процедура (удаление папилломы, вскрытие абсцесса, наложение швов): виды помощи
#     minor_care (поликлиника — первой); ни major, ни minor — care класса;
#   orders — способы оказания (orders ниже: planned / emergency), пункты о порядке которых ищутся в программе;
#   skip_care — вид помощи слота вопроса, при котором класс не применяется (вопрос о стоматологии, услуга
#     «удаление зуба» — часть стоматологии, а не хирургия стационара);
#   exclusion_words — леммы (и фразы) самого класса, по которым исключение программы относится к случаю
#     («пластические операции» — для ринопластики); общие слова (procedures.generic) — недостаточны, нужна сама
#     процедура или анатомия вопроса (guided._class_exclusions).
procedure_classes:
  dental:
    name: стоматологическое вмешательство
    words: [зуб, зубной, стоматологический, стоматология, пломба, кариес, пульпит, имплантация зуб, удаление зуб,
            коронка, брекет]
    care: [dental]
    orders: []
    exclusion_words: []
  reproductive:
    name: вспомогательные репродуктивные технологии (ЭКО)
    words: [ЭКО, ВРТ, оплодотворение, экстракорпоральный оплодотворение, бесплодие, инсеминация, ИКСИ,
            репродуктивный]
    care: [outpatient, inpatient]
    orders: []
    exclusion_words: [бесплодие, оплодотворение, экстракорпоральный оплодотворение, ЭКО, репродуктивный]
  vaccination:
    name: вакцинация (прививка)
    words: [прививка, вакцинация, вакцина, иммунизация, привить, прививать]
    care: [outpatient]
    orders: []
    exclusion_words: [прививка, вакцинация, вакцина, иммунизация, вакцинопрофилактика]
  dialysis:
    name: диализ (экстракорпоральные методы лечения)
    words: [гемодиализ, диализ, гемосорбция, плазмаферез, плазмоферез, гемофильтрация]
    care: [inpatient, outpatient]
    orders: []
    exclusion_words: [гемодиализ, диализ, экстракорпоральный метод, экстракорпоральный метод лечение, плазмаферез,
                      плазмоферез, гемосорбция]
  childbirth:
    name: роды и родоразрешение
    words: [роды, рожать, родить, родоразрешение, кесарев, кесарево сечение, роддом, родильный, родовой]
    care: [inpatient]
    orders: [planned, emergency]
    exclusion_words: [роды, родоразрешение, беременность, кесарев, родовспоможение, акушерский]
  intensive_care:
    name: реанимация и интенсивная терапия
    words: [реанимация, реанимационный, реанимировать, интенсивный терапия, ОРИТ, реанимашка]
    care: [inpatient, emergency]
    orders: [emergency]
    exclusion_words: [реанимация, реанимационный, интенсивный терапия]
  cardiovascular:
    name: кардиохирургия и эндоваскулярное вмешательство
    words: [шунтирование, стентирование, стент, ангиопластика, эндоваскулярный, кардиохирургия,
            кардиохирургический, коронарография, коронароангиография, операция сердце]
    care: [inpatient]
    orders: [planned, emergency]
    exclusion_words: [кардиохирургический, кардиохирургия, эндоваскулярный, стентирование, стент, шунтирование,
                      ангиопластика]
  plastic:
    name: пластическая или эстетическая операция
    words: [ринопластика, липосакция, блефаропластика, маммопластика, абдоминопластика, отопластика, пластика,
            пластический, эстетический, косметический, косметология, косметологический, косметика,
            подтяжка, татуировка]
    care: [inpatient]
    major: [ринопластика, липосакция, блефаропластика, маммопластика, абдоминопластика]
    major_care: [inpatient]
