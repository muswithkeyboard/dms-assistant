# orders — способы оказания стационарной помощи: пункт программы о порядке находится поиском (query) и
#   выбирается шаблонами: patterns — способ назван; requires — в пункте есть условие порядка (направление,
#   согласование, пульт) — без него пункт не считается «правилом» способа; min_chars — короче — заголовок раздела.
#   skip — пункт раздела об оплате премии / взносах / неуплате / расторжении (заголовки раздела и сам пункт):
#     не порядок оказания помощи («Страховщик оплачивает исключительно экстренную помощь» при просрочке взноса);
#   prefer — раздел о порядке оказания помощи (приложение-программа, «организация / порядок оказания …»): такой
#     пункт выбирается раньше пункта общего раздела.
order_skip: ['страхов\w*\s+преми', 'взнос', 'неуплат', 'просроч', 'расторж', 'страхов\w*\s+сумм', 'численност',
             'досрочн\w*\s+прекращ']
order_prefer: ['порядок\s+(?:\w+\s+){0,2}?(?:получени|оказани|организаци|предоставлени)', 'организаци\w*\s+(?:\w+\s+)?(?:медицинск|помощ)',
               'объем\w*\s+и\s+порядок', 'программ', 'стационар', 'госпитализац', 'приложени']
orders:
  planned:
    name: плановая госпитализация
    query: плановая госпитализация по направлению врача согласование со страховщиком
    patterns: ['планов\w*\s+(?:\w+\s+){0,2}?(?:госпитализ|стационар)']
    requires: ['направлени', 'согласова', 'пульт', 'гарантийн']
    min_chars: 60
  emergency:
    name: экстренная госпитализация
    query: экстренная госпитализация по экстренным показаниям скорая медицинская помощь
    patterns: ['экстренн\w*\s+(?:\w+\s+){0,2}?(?:госпитализ|стационар)']
    requires: ['осуществля', 'показани', 'скор', 'срочн', 'организ', 'оплачива']
    min_chars: 60
